<head>

<style>
:root{
  --background:0 0% 100%;
  --foreground:240 10% 3.9%;
  --card:0 0% 100%;
  --card-foreground:240 10% 3.9%;
  --popover:0 0% 100%;
  --popover-foreground:240 10% 3.9%;
  --primary:240 5.9% 10%;
  --primary-foreground:0 0% 98%;
  --secondary:240 4.8% 95.9%;
  --secondary-foreground:240 5.9% 10%;
  --muted:240 4.8% 95.9%;
  --muted-foreground:240 3.8% 46.1%;
  --accent:240 4.8% 95.9%;
  --accent-foreground:240 5.9% 10%;
  --destructive:0 84.2% 60.2%;
  --destructive-foreground:0 0% 98%;
  --border:240 5.9% 90%;
  --input:240 5.9% 90%;
  --ring:240 10% 3.9%;
  --radius:.5rem;
}
.dark{
  --background:240 10% 3.9%;
  --foreground:0 0% 98%;
  --card:240 10% 3.9%;
  --card-foreground:0 0% 98%;
  --popover:240 10% 3.9%;
  --popover-foreground:0 0% 98%;
  --primary:0 0% 98%;
  --primary-foreground:240 5.9% 10%;
  --secondary:240 3.7% 15.9%;
  --secondary-foreground:0 0% 98%;
  --muted:240 3.7% 15.9%;
  --muted-foreground:240 5% 64.9%;
  --accent:240 3.7% 15.9%;
  --accent-foreground:0 0% 98%;
  --destructive:0 62.8% 30.6%;
  --destructive-foreground:0 0% 98%;
  --border:240 3.7% 15.9%;
  --input:240 3.7% 15.9%;
  --ring:240 4.9% 83.9%;
}
*{margin:0;padding:0;box-sizing:border-box;border-color:hsl(var(--border))}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:hsl(var(--background));color:hsl(var(--foreground));min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.topbar{position:sticky;top:0;z-index:50;border-bottom:1px solid hsl(var(--border));background:hsl(var(--background) / .85);backdrop-filter:blur(12px)}
.topbar-inner{max-width:80rem;margin:0 auto;height:3.5rem;padding:0 1.5rem;display:flex;align-items:center;gap:1.5rem}
.brand{display:flex;align-items:center;gap:.6rem;font-size:.875rem;font-weight:600;letter-spacing:-.01em}
.brand-mark{width:1.5rem;height:1.5rem;border-radius:.375rem;background:hsl(var(--primary));color:hsl(var(--primary-foreground));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.topnav{display:flex;align-items:center;gap:.25rem;margin-left:1rem}
.topnav a{padding:.45rem .75rem;border-radius:calc(var(--radius) - 2px);font-size:.875rem;font-weight:500;color:hsl(var(--muted-foreground))}
.topnav a:hover{color:hsl(var(--foreground));background:hsl(var(--accent))}
.topnav a.active{color:hsl(var(--foreground));background:hsl(var(--accent))}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.page{max-width:80rem;margin:0 auto;padding:1.5rem}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.page-title{font-size:1.5rem;font-weight:700;letter-spacing:-.025em;line-height:2rem}
.page-desc{margin-top:.25rem;font-size:.875rem;color:hsl(var(--muted-foreground))}
.period-picker{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.range-hint{font-size:.75rem;color:hsl(var(--muted-foreground));font-family:"Geist Mono",monospace;white-space:nowrap}
.range-group{display:inline-flex;align-items:center;gap:1px;background:hsl(var(--muted));border-radius:calc(var(--radius) - 2px);padding:3px}
.range-btn{padding:.3rem .65rem;border-radius:calc(var(--radius) - 4px);font-size:.75rem;font-weight:500;color:hsl(var(--muted-foreground))}
.range-btn:hover{color:hsl(var(--foreground))}
.range-btn.active{background:hsl(var(--background));color:hsl(var(--foreground));box-shadow:0 1px 2px hsl(0 0% 0% / .3)}
.custom-range{position:relative;display:flex;align-items:center;gap:.4rem}
.custom-range.hidden{display:none}
.custom-range input[type="date"]{height:2rem;padding:.25rem .5rem;background:hsl(var(--background));border:1px solid hsl(var(--input));border-radius:calc(var(--radius) - 2px);color:hsl(var(--foreground));font-family:"Geist Mono",monospace;font-size:.75rem;color-scheme:dark}
.custom-range input[type="date"]:focus{outline:2px solid hsl(var(--ring));outline-offset:1px}
.range-sep{color:hsl(var(--muted-foreground));font-size:.75rem}
.cal-pop{position:absolute;top:calc(100% + 5px);right:0;z-index:30;min-width:260px;padding:.75rem;background:hsl(var(--popover));border:1px solid hsl(var(--border));border-radius:var(--radius);box-shadow:0 8px 24px hsl(0 0% 0% / .45)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}
.cal-title{font-size:.8125rem;font-weight:500}
.cal-nav{width:1.75rem;height:1.75rem;display:flex;align-items:center;justify-content:center;border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px);color:hsl(var(--muted-foreground));font-size:.875rem}
.cal-nav:hover{color:hsl(var(--foreground));background:hsl(var(--accent))}
.cal-grid{display:grid;grid-template-columns:repeat(7,2.25rem);gap:2px;justify-content:center}
.cal-dow{color:hsl(var(--muted-foreground));font-size:.7rem;text-align:center;padding:.2rem 0;font-weight:500}
.cal-day{height:2.25rem;border-radius:calc(var(--radius) - 2px);font-family:"Geist Mono",monospace;font-size:.75rem;text-align:center}
.cal-day:hover{background:hsl(var(--accent))}
.cal-day.dim{visibility:hidden}
.cal-day.today{outline:1px solid hsl(var(--muted-foreground));outline-offset:-1px}
.cal-day.in-range{background:hsl(var(--accent))}
.cal-day.picked{background:hsl(var(--primary));color:hsl(var(--primary-foreground));font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin-bottom:1rem}
.card{border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--card));color:hsl(var(--card-foreground));box-shadow:0 1px 2px hsl(0 0% 0% / .25)}
.card-header{display:flex;flex-direction:column;gap:.375rem;padding:1.25rem 1.5rem 0}
.card-title{font-size:.875rem;font-weight:500}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.card-desc{font-size:.875rem;color:hsl(var(--muted-foreground))}
.card-content{padding:1.25rem 1.5rem}
.kpi-body{padding:1.25rem 1.5rem}
.stat-num{display:block;font-size:1.5rem;font-weight:600;letter-spacing:-.025em;line-height:2rem;font-variant-numeric:tabular-nums}
.stat-sub{display:block;margin-top:.25rem;font-size:.75rem;color:hsl(var(--muted-foreground));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.badge{display:inline-flex;align-items:center;border-radius:9999px;border:1px solid hsl(var(--border));padding:.1rem .5rem;font-size:.6875rem;font-weight:500}
.badge-secondary{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));border-color:transparent}
.chart-card{margin-bottom:1rem}
.chart-layout{display:flex;gap:1.5rem;align-items:stretch}
.chart-canvas{min-width:0;flex:1;position:relative}
canvas#tokenChart{display:block;width:100%;height:300px}
canvas#tokenChart.active{cursor:pointer}
.chart-key{width:200px;flex:0 0 200px;min-width:0;border-left:1px solid hsl(var(--border));padding-left:1.25rem}
.chart-key-title{font-size:.75rem;font-weight:500;color:hsl(var(--muted-foreground));margin-bottom:.5rem}
.chart-key-list{display:flex;flex-direction:column;gap:.15rem}
.legend-item{display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;gap:.5rem;width:100%;padding:.35rem .5rem;border-radius:calc(var(--radius) - 2px);font-size:.8125rem;text-align:left;user-select:none}
.legend-item:hover{background:hsl(var(--accent))}
.legend-item.off{opacity:.35}
.legend-item.off .legend-name{text-decoration:line-through}
.legend-dot{width:8px;height:8px;border-radius:9999px;flex-shrink:0}
.legend-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend-value{font-family:"Geist Mono",monospace;font-size:.75rem;color:hsl(var(--muted-foreground));white-space:nowrap}
.legend-more{margin-top:.5rem;font-size:.75rem;color:hsl(var(--muted-foreground))}
.chart-empty{height:300px;display:flex;align-items:center;justify-content:center;color:hsl(var(--muted-foreground));font-size:.875rem}
.chart-tip{position:absolute;z-index:20;min-width:190px;max-width:290px;padding:.75rem;background:hsl(var(--popover));border:1px solid hsl(var(--border));border-radius:var(--radius);box-shadow:0 8px 24px hsl(0 0% 0% / .45);pointer-events:none;font-size:.8125rem}
.chart-tip-head{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;margin-bottom:.5rem;padding-bottom:.5rem;border-bottom:1px solid hsl(var(--border))}
.chart-tip-date{font-weight:500;white-space:nowrap}
.chart-tip-total{font-family:"Geist Mono",monospace;white-space:nowrap}
.chart-tip-list{display:flex;flex-direction:column;gap:.25rem}
.chart-tip-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;gap:.5rem}
.chart-tip-row .dot{width:8px;height:8px;border-radius:9999px;flex-shrink:0}
.chart-tip-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart-tip-value{font-family:"Geist Mono",monospace;font-size:.75rem;color:hsl(var(--muted-foreground));white-space:nowrap}
.chart-tip-more{margin-top:.4rem;color:hsl(var(--muted-foreground));font-size:.75rem}
.chart-tip-hint{margin-top:.5rem;padding-top:.5rem;border-top:1px solid hsl(var(--border));color:hsl(var(--muted-foreground));font-size:.6875rem}
.tabs-list{display:inline-flex;align-items:center;gap:1px;background:hsl(var(--muted));border-radius:calc(var(--radius) - 2px);padding:3px}
.tabs-trigger{padding:.35rem .8rem;border-radius:calc(var(--radius) - 4px);font-size:.8125rem;font-weight:500;color:hsl(var(--muted-foreground));display:inline-flex;align-items:center;gap:.4rem}
.tabs-trigger:hover{color:hsl(var(--foreground))}
.tabs-trigger.active{background:hsl(var(--background));color:hsl(var(--foreground));box-shadow:0 1px 2px hsl(0 0% 0% / .3)}
.tabs-badge{font-family:"Geist Mono",monospace;font-size:.6875rem;color:hsl(var(--muted-foreground))}
.data-table{width:100%;border-collapse:collapse;font-size:.8125rem}
.data-table thead th{padding:.65rem .75rem;text-align:left;font-size:.75rem;font-weight:500;color:hsl(var(--muted-foreground));border-bottom:1px solid hsl(var(--border))}
.data-table thead th.num,.data-table tbody td.num{text-align:right;font-family:"Geist Mono",monospace;font-size:.75rem;white-space:nowrap}
.data-table thead th.num-r,.data-table tbody td.num-r{text-align:right}
.data-table tbody tr{border-bottom:1px solid hsl(var(--border));cursor:pointer}
.data-table tbody tr:last-child{border-bottom:0}
.data-table tbody tr:hover{background:hsl(var(--muted) / .5)}
.data-table tbody tr.off{opacity:.35}
.data-table tbody tr.off .cell-name{text-decoration:line-through}
.data-table td{padding:.55rem .75rem;vertical-align:middle}
.cell-name{display:flex;align-items:center;gap:.6rem;min-width:0}
.cell-name .dot{width:8px;height:8px;border-radius:9999px;flex-shrink:0}
.cell-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-share{display:flex;align-items:center;justify-content:flex-end;gap:.5rem}
.progress{width:4.5rem;height:.5rem;border-radius:9999px;background:hsl(var(--secondary));overflow:hidden;flex-shrink:0}
.progress-bar{height:100%;border-radius:9999px}
.cell-muted{color:hsl(var(--muted-foreground))}
.page-meta{padding:1rem 0 2rem;text-align:center;font-family:"Geist Mono",monospace;font-size:.75rem;color:hsl(var(--muted-foreground))}
.site-footer{border-top:1px solid hsl(var(--border))}
.site-footer-inner{max-width:80rem;margin:0 auto;padding:1.25rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.8125rem;color:hsl(var(--muted-foreground))}
.site-footer nav{display:flex;gap:1.25rem}
.site-footer a:hover{color:hsl(var(--foreground))}
.avatar{width:2rem;height:2rem;border-radius:9999px;overflow:hidden;flex-shrink:0;background:hsl(var(--muted));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;color:hsl(var(--muted-foreground))}
.avatar img{width:100%;height:100%;object-fit:cover}
.dialog-overlay{position:fixed;inset:0;background:hsl(0 0% 0% / .7);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.dialog{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);padding:1.5rem;width:100%;max-width:26rem;box-shadow:0 12px 32px hsl(0 0% 0% / .5)}
.dialog h3{font-size:1.125rem;font-weight:600;margin-bottom:.25rem}
.dialog p.dialog-desc{font-size:.875rem;color:hsl(var(--muted-foreground));margin-bottom:1.25rem}
.dialog label{display:block;font-size:.8125rem;font-weight:500;margin-bottom:.35rem}
.dialog input{width:100%;height:2.25rem;padding:0 .75rem;font-size:.875rem;background:hsl(var(--background));border:1px solid hsl(var(--input));border-radius:calc(var(--radius) - 2px);color:hsl(var(--foreground));margin-bottom:1rem;outline:none}
.dialog input:focus{border-color:hsl(var(--ring))}
.dialog-actions{display:flex;gap:.5rem;justify-content:flex-end}
.skeleton{border-radius:calc(var(--radius) - 2px);background:hsl(var(--muted));animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.alert{display:flex;align-items:center;gap:.75rem;border:1px solid hsl(var(--destructive));border-radius:var(--radius);background:hsl(var(--destructive) / .1);padding:1rem;color:hsl(var(--foreground));font-size:.875rem}
.alert button{margin-left:auto;flex-shrink:0}
.loading-wrap{display:flex;flex-direction:column;gap:1rem}
@media(max-width:1024px){
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chart-layout{flex-direction:column;align-items:stretch}
  .chart-key{width:100%;flex-basis:auto;border-left:0;border-top:1px solid hsl(var(--border));padding-left:0;padding-top:1rem}
  .chart-key-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:1rem}
}
@media(max-width:640px){
  .page{padding:1rem}
  .topbar-inner{padding:0 1rem}
  .topnav{display:none}
  .kpi-grid{grid-template-columns:1fr}
  .hide-sm{display:none}
  .progress{width:3rem}
  .card-content{padding:1rem}
  canvas#tokenChart{height:240px}
  .chart-empty{height:240px}
  .chart-key-list{grid-template-columns:1fr}
}
.table-scroll{overflow-x:auto;margin:0 -1.5rem;padding:0 1.5rem}
.table-scroll .data-table{min-width:34rem}
</style>

<main class="page" id="top">

<div id="dialogRoot"></div>

<script>
let DASH = null;
let ALL_STATS = null;
let hasLoaded = false;
const hiddenModels = new Set();
const hiddenSources = new Set();
let statsPeriod = 'all';
let statsCustom = {from:'', to:''};
let chartRange = '30d';
let breakTab = 'models';
let pinnedBucket = -1;
let chartView = null;
let calTarget = 'from';
let calCursor = '';

const profileParams = new URLSearchParams(location.search);
let userName = profileParams.get('name')?.trim() || localStorage.getItem('tmx_name') || 'nico2525nn';
let avatarUrl = profileParams.get('avatar')?.trim() || localStorage.getItem('tmx_avatar') || 'https://avatars.githubusercontent.com/u/173241093?v=4';

function saveStatsPeriod() {
  try {
    localStorage.setItem('tmx_stats_period', statsPeriod);
    localStorage.setItem('tmx_stats_custom', JSON.stringify(statsCustom));
  } catch {}
}
function loadStatsPeriod() {
  try {
    const saved = localStorage.getItem('tmx_stats_period');
    if (saved === '7' || saved === '30' || saved === '90' || saved === 'all' || saved === 'custom') statsPeriod = saved;
    const custom = JSON.parse(localStorage.getItem('tmx_stats_custom') || '{}');
    if (/^\d{4}-\d{2}-\d{2}$/.test(custom.from || '') && /^\d{4}-\d{2}-\d{2}$/.test(custom.to || '')) statsCustom = {from:custom.from, to:custom.to};
    else statsCustom = {from:'', to:''};
  } catch { statsPeriod = 'all'; statsCustom = {from:'', to:''}; }
}
const initialTab = new URLSearchParams(location.search).get('tab');
if (initialTab === 'harness') breakTab = 'harness';

function renderAll() {
  ALL_STATS = buildView(DASH, {hiddenSources, statsPeriod, statsCustom});
  pinnedBucket = -1;
  renderPeriod();
  renderKpis();
  renderChartCard();
  renderBreakdown();
  drawChart();
  const win = statsPeriodWindow(DASH ? DASH.daily || [] : [], statsPeriod, statsCustom);
  document.getElementById('statsRangeLabel').textContent = win ? win.from + ' – ' + win.to : 'all time';
  bindStatsCustomRange();
  document.getElementById('pageMeta').textContent = ALL_STATS.firstDate ? ALL_STATS.firstDate + ' – ' + ALL_STATS.lastDate + ' · ' + ALL_STATS.activeDays + ' active days' : 'No token data';
  renderAvatar();
}

function renderPeriod() {
  const presets = [['7','7D'],['30','30D'],['90','90D'],['all','ALL'],['custom','Custom']];
  document.getElementById('statsRangeGroup').innerHTML = presets.map(function(p) {
    return '<button class="range-btn' + (statsPeriod === p[0] ? ' active' : '') + '" data-period="' + p[0] + '" aria-pressed="' + (statsPeriod === p[0]) + '">' + p[1] + '</button>';
  }).join('');
  document.getElementById('statsRangeGroup').querySelectorAll('button').forEach(function(btn) {
    btn.onclick = function() { setStatsPeriod(btn.dataset.period); };
  });
  const range = document.getElementById('customRange');
  const show = statsPeriod === 'custom';
  range.classList.toggle('hidden', !show);
  if (show) {
    document.getElementById('customFrom').value = statsCustom.from;
    document.getElementById('customTo').value = statsCustom.to;
  }
}

function setStatsPeriod(period) {

    const days = DASH ? DASH.daily || [] : [];

}

// ---- custom-range calendar popover ----
function calOpenDays() {
  const days = DASH && DASH.daily ? DASH.daily.map(function(d) { return d.date; }) : [];
  return {first:days.length ? days[0] : isoDate(new Date()), last:days.length ? days[days.length - 1] : isoDate(new Date())};
}
function fmtMonthLabel(value) {
  const parts = value.split('-').map(Number);
  return parts[0] + '-' + String(parts[1]).padStart(2, '0');
}
function renderCalPop() {
  const host = document.getElementById('customRange');
  if (!host) return;
  let pop = host.querySelector('.cal-pop');
  if (!pop) {
    pop = document.createElement('div');
    pop.className = 'cal-pop';
    host.appendChild(pop);
  }
  const bounds = calOpenDays();
  if (!calCursor || calCursor < bounds.first.slice(0, 7) || calCursor > bounds.last.slice(0, 7)) {
    const seed = calTarget === 'to' ? statsCustom.to : statsCustom.from;
    calCursor = /^20\d\d-\d\d-\d\d$/.test(seed || '') ? seed.slice(0, 7) : statsCustom.to ? statsCustom.to.slice(0, 7) : statsCustom.from ? statsCustom.from.slice(0, 7) : bounds.last.slice(0, 7);
  }
  const parts = calCursor.split('-').map(Number);
  const monthFirst = new Date(Date.UTC(parts[0], parts[1] - 1, 1));
  const leadBlanks = monthFirst.getUTCDay();
  const daysInMonth = new Date(Date.UTC(parts[0], parts[1], 0)).getUTCDate();
  const today = isoDate(new Date());
  let html = '<div class="cal-head"><button class="cal-nav" data-cal-nav="-1" aria-label="Previous month">‹</button><span class="cal-title">' + fmtMonthLabel(calCursor + '-01') + '</span><button class="cal-nav" data-cal-nav="1" aria-label="Next month">›</button></div><div class="cal-grid">';
  ['S','M','T','W','T','F','S'].forEach(function(d) { html += '<span class="cal-dow">' + d + '</span>'; });
  for (let blank = 0; blank < leadBlanks; blank++) html += '<span class="cal-day dim">·</span>';
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = calCursor + '-' + String(day).padStart(2, '0');
    let cls = 'cal-day';
    if (iso === today) cls += ' today';
    const from = statsCustom.from, to = statsCustom.to;
    if (iso === from || iso === to) cls += ' picked';
    else if (from && to && iso > from && iso < to) cls += ' in-range';
    html += '<button class="' + cls + '" data-cal-day="' + iso + '">' + day + '</button>';
  }
  html += '</div>';
  pop.innerHTML = html;
  pop.querySelectorAll('[data-cal-nav]').forEach(function(btn) {
    btn.onclick = function() {
      const next = new Date(Date.UTC(parts[0], parts[1] - 1 + Number(btn.dataset.calNav), 1));
      calCursor = isoDate(next).slice(0, 7);
      renderCalPop();
    };
  });
  pop.querySelectorAll('[data-cal-day]').forEach(function(btn) {
    btn.onclick = function() { calPickDay(btn.dataset.calDay); };
  });
}
function calPickDay(iso) {
  if (calTarget === 'from') {
    statsCustom.from = iso;
    if (statsCustom.to && statsCustom.to < iso) statsCustom.to = iso;
    calTarget = 'to';
  } else {
    statsCustom.to = iso;
    if (statsCustom.from && statsCustom.from > iso) statsCustom.from = iso;
    calTarget = 'from';
  }
  saveStatsPeriod();
  const fromInput = document.getElementById('customFrom');
  const toInput = document.getElementById('customTo');
  if (fromInput) fromInput.value = statsCustom.from;
  if (toInput) toInput.value = statsCustom.to;
  statsPeriod = 'custom';
  closeCalPop();
  renderAll();
}
function closeCalPop() {
  const pop = document.querySelector('#customRange .cal-pop');
  if (pop) pop.remove();
}
function bindStatsCustomRange() {
  for (const id of ['customFrom', 'customTo']) {
    const input = document.getElementById(id);
    if (!input || input.dataset.bound) continue;
    input.dataset.bound = '1';
    input.addEventListener('focus', function() {
      calTarget = id === 'customTo' ? 'to' : 'from';
      const seed = calTarget === 'to' ? statsCustom.to : statsCustom.from;
      if (/^20\d\d-\d\d-\d\d$/.test(seed || '')) calCursor = seed.slice(0, 7);
      renderCalPop();
    });
    input.addEventListener('change', applyStatsCustomRange);
  }
  if (!document.body.dataset.calBound) {
    document.body.dataset.calBound = '1';
    document.addEventListener('pointerdown', function(event) {
      if (!event.target.closest('#customRange')) closeCalPop();
    });
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeCalPop();
    });
  }
}
function applyStatsCustomRange() {
  const from = document.getElementById('customFrom');
  const to = document.getElementById('customTo');
  if (!from || !to || !from.value || !to.value || from.value > to.value) return;
  if (from.value !== statsCustom.from || to.value !== statsCustom.to) {
    statsCustom.from = from.value;
    statsCustom.to = to.value;
    saveStatsPeriod();
  }
  statsPeriod = 'custom';
  renderAll();
}

// ---- canvas chart (same engine as the legacy page) ----
const CHART_RANGE_DAYS = 30;
const CHART_RANGE_MIN_DAYS = 7;

function chartTipHtml(index) {
  if (!chartView) return '';
  const bucket = chartView.buckets[index];
  if (!bucket) return '';
  const start = bucket.date;
  const label = chartView.calendar.step === 1 ? start : start + ' – ' + addDays(start, chartView.calendar.step - 1);
  const rows = Object.entries(bucket.models)
    .filter(function(entry) { return entry[1] > 0 && !hiddenModels.has(entry[0]); })
    .sort(function(a, b) { return b[1] - a[1]; });
  const total = rows.reduce(function(sum, entry) { return sum + entry[1]; }, 0);
  let html = '<div class="chart-tip-head"><span class="chart-tip-date">' + escapeHtml(label) + '</span><span class="chart-tip-total">' + fmt(total) + '</span></div>';
  if (!rows.length) {
    html += '<p class="chart-tip-more">No token usage</p>';
  } else {
    html += '<div class="chart-tip-list">';
    rows.slice(0, 8).forEach(function(entry) {
      html += '<div class="chart-tip-row"><span class="dot" style="background:' + getModelColor(entry[0]) + '"></span><span class="chart-tip-name" title="' + escapeHtml(entry[0]) + '">' + escapeHtml(shortModel(entry[0])) + '</span><span class="chart-tip-value">' + (entry[1] / total * 100).toFixed(1) + '%</span></div>';
    });
    html += '</div>';
    if (rows.length > 8) html += '<p class="chart-tip-more">+' + (rows.length - 8) + ' more models</p>';
  }
  html += '<p class="chart-tip-hint">' + (pinnedBucket === index ? 'Click to unpin' : 'Click to pin') + '</p>';
  return html;
}

function hideChartTip() {
  const tip = document.querySelector('.chart-tip');
  if (tip) tip.remove();
  const canvas = document.getElementById('tokenChart');
  if (canvas) canvas.classList.remove('active');
}

function showChartTip(index, anchorX) {
  const canvas = document.getElementById('tokenChart');
  if (!canvas || !chartView || index < 0 || index >= chartView.buckets.length) {
    hideChartTip();
    return;
  }
  const host = canvas.parentElement;
  let tip = host.querySelector('.chart-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.className = 'chart-tip';
    host.appendChild(tip);
  }
  tip.innerHTML = chartTipHtml(index);
  const x = chartView.pad.left + index * chartView.slotWidth + chartView.barWidth / 2;
  const tipWidth = tip.offsetWidth;
  const hostWidth = host.clientWidth;
  let left = anchorX + 12;
  if (left + tipWidth > hostWidth - 4) left = x - tipWidth - 12;
  tip.style.left = Math.max(4, left) + 'px';
  tip.style.top = chartView.pad.top + 'px';
  canvas.classList.add('active');
}

function chartBucketAt(clientX) {
  const canvas = document.getElementById('tokenChart');
  if (!canvas || !chartView) return -1;
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  if (x < chartView.pad.left || x > rect.width - chartView.pad.right) return -1;
  const index = Math.floor((x - chartView.pad.left) / chartView.slotWidth);
  return index >= 0 && index < chartView.buckets.length ? index : -1;
}

function drawChart() {
  const canvas = document.getElementById('tokenChart');
  const legend = document.getElementById('chartLegend');
  if (!canvas || !legend) return;
  const visible = new Set();
  for (const row of DASH && DASH.sources ? DASH.sources : []) {
    if (!hiddenSources.has(row.source)) visible.add(row.source);
  }
  const daily = chartDaily(DASH ? DASH.daily || [] : [], visible);
  const window_ = chartWindow(daily, chartRange, CHART_RANGE_DAYS, CHART_RANGE_MIN_DAYS);
  const calendar = window_ ? makeCalendarBuckets(daily, window_.from, window_.to) : {buckets:[],span:0,step:1};
  const buckets = calendar.buckets;

  // Rank and colour models by what is actually plotted, so the legend matches
  // the bars instead of the whole history.
  const totals = {};
  buckets.forEach(function(bucket) {
    for (const model in bucket.models) totals[model] = (totals[model] || 0) + bucket.models[model];
  });
  const names = Object.keys(totals);
  const ranked = Object.entries(totals).sort(function(a,b) { return b[1] - a[1]; });
  const windowTotal = buckets.reduce(function(sum, bucket) { return sum + bucket.total; }, 0);
  const colors = {};
  names.forEach(function(name) { colors[name] = getModelColor(name); });
  legend.innerHTML = ranked.length ? '<div class="chart-key-list">' + ranked.slice(0, 8).map(function(entry, index) {
    const model = entry[0];
    const off = hiddenModels.has(model) ? ' off' : '';
    return '<button class="legend-item' + off + '" onclick="toggleModel(' + inlineArg(model) + ')" aria-pressed="' + (!hiddenModels.has(model)) + '"><span class="legend-dot" style="background:' + colors[model] + '"></span><span class="legend-name" title="' + escapeHtml(model) + '">' + escapeHtml(shortModel(model)) + '</span><span class="legend-value">' + (entry[1] / (windowTotal || 1) * 100).toFixed(1) + '%</span></button>';
  }).join('') + '</div>' + (ranked.length > 8 ? '<p class="legend-more">+' + (ranked.length - 8) + ' more in breakdown</p>' : '') : '<p class="card-desc">No model data</p>';

  const rangeLabel = document.getElementById('chartRangeLabel');
  if (rangeLabel) rangeLabel.textContent = window_ ? window_.from + ' – ' + window_.to : '';

  const context = canvas.getContext('2d');
  if (!daily.length) {
    chartView = null;
    pinnedBucket = -1;
    hideChartTip();
    canvas.width = 1;
    canvas.height = 1;
    canvas.style.display = 'none';
    const empty = canvas.parentElement.querySelector('.chart-empty');
    if (!empty) canvas.parentElement.insertAdjacentHTML('beforeend', '<div class="chart-empty">No token data</div>');
    return;
  }
  canvas.style.display = 'block';
  canvas.parentElement.querySelector('.chart-empty')?.remove();
  const visibleModels = names.filter(function(model) { return !hiddenModels.has(model); });
  const values = buckets.map(function(bucket) { return visibleModels.reduce(function(sum, model) { return sum + (bucket.models[model] || 0); }, 0); });
  const maxValue = niceMax(Math.max.apply(Math, values.concat([0])));
  const dpr = window.devicePixelRatio || 1;
  const width = Math.max(240, canvas.parentElement.clientWidth || 600);
  const height = window.innerWidth <= 560 ? 240 : 300;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  context.setTransform(dpr, 0, 0, dpr, 0, 0);
  context.clearRect(0, 0, width, height);
  const pad = {top:12,bottom:30,left:48,right:8};
  const plotWidth = Math.max(1, width - pad.left - pad.right);
  const plotHeight = Math.max(1, height - pad.top - pad.bottom);
  const slotWidth = plotWidth / buckets.length;
  const barWidth = Math.max(2, Math.min(12, slotWidth * .72));
  context.font = '10px Inter,sans-serif';
  context.textAlign = 'right';
  for (let tick = 0; tick <= 4; tick++) {
    const y = pad.top + plotHeight - plotHeight * tick / 4;
    context.fillStyle = 'hsl(240 5% 64.9%)';
    context.fillText(fmt(maxValue * tick / 4), pad.left - 8, y + 3);
    context.strokeStyle = tick === 0 ? 'hsl(240 5% 64.9% / .45)' : 'hsl(240 3.7% 15.9% / .9)';
    context.lineWidth = 1;
    context.beginPath();
    context.moveTo(pad.left, y + .5);
    context.lineTo(width - pad.right, y + .5);
    context.stroke();
  }
  buckets.forEach(function(bucket, bucketIndex) {
    const x = pad.left + bucketIndex * slotWidth + (slotWidth - barWidth) / 2;
    let bottom = pad.top + plotHeight;
    visibleModels.forEach(function(model) {
      const value = bucket.models[model] || 0;
      if (!value) return;
      const barHeight = value / maxValue * plotHeight;
      context.fillStyle = colors[model];
      context.fillRect(x, bottom - barHeight, barWidth, barHeight);
      bottom -= barHeight;
    });
  });
  const labels = [];
  let lastMonth = -1;
  buckets.forEach(function(bucket, index) {
    const date = dateFromIso(bucket.date);
    if (calendar.span <= 45) {
      const stride = Math.max(1, Math.ceil(buckets.length / 7));
      if (index % stride === 0) labels.push({index,text:axisLabel(bucket.date,calendar.span)});
    } else if (date.getUTCMonth() !== lastMonth) {
      labels.push({index,text:axisLabel(bucket.date,calendar.span)});
      lastMonth = date.getUTCMonth();
    }
  });
  if (labels.length && labels[labels.length - 1].index === buckets.length - 1 && labels.length > 1) labels.pop();
  context.textAlign = 'center';
  context.fillStyle = 'hsl(240 5% 64.9%)';
  labels.forEach(function(label) {
    const x = pad.left + label.index * slotWidth + slotWidth / 2;
    context.fillText(label.text, x, height - 9);
  });
  chartView = {buckets, calendar, pad, slotWidth, barWidth};
  if (!canvas.dataset.tipBound) {
    canvas.dataset.tipBound = '1';
    canvas.addEventListener('mousemove', function(event) {
      if (pinnedBucket >= 0) return;
      const index = chartBucketAt(event.clientX);
      if (index < 0) {
        hideChartTip();
        return;
      }
      showChartTip(index, event.clientX - canvas.getBoundingClientRect().left);
    });
    canvas.addEventListener('mouseleave', function() {
      if (pinnedBucket < 0) hideChartTip();
    });
    canvas.addEventListener('click', function(event) {
      const index = chartBucketAt(event.clientX);
      if (index < 0) {
        pinnedBucket = -1;
        hideChartTip();
        return;
      }
      pinnedBucket = pinnedBucket === index ? -1 : index;
      if (pinnedBucket < 0) {
        hideChartTip();
        return;
      }
      showChartTip(pinnedBucket, event.clientX - canvas.getBoundingClientRect().left);
    });
  }
  if (pinnedBucket >= 0) showChartTip(pinnedBucket, chartView.pad.left + pinnedBucket * chartView.slotWidth);
}

function renderAll() {
  ALL_STATS = buildView(DASH, {hiddenSources, statsPeriod, statsCustom});
  pinnedBucket = -1;
  renderPeriod();
  renderKpis();
  renderChartCard();
  renderBreakdown();
  drawChart();
  const win = statsPeriodWindow(DASH ? DASH.daily || [] : [], statsPeriod, statsCustom);
  document.getElementById('statsRangeLabel').textContent = win ? win.from + ' – ' + win.to : 'all time';
  bindStatsCustomRange();
  document.getElementById('pageMeta').textContent = ALL_STATS.firstDate ? ALL_STATS.firstDate + ' – ' + ALL_STATS.lastDate + ' · ' + ALL_STATS.activeDays + ' active days' : 'No token data';
  renderAvatar();
}

async function loadData() {
  try {
    const response = await fetch('/api/dashboard', {cache:'no-store'});
    if (response.status === 503) throw Error('still building the first snapshot — retrying');
    if (!response.ok) throw Error('API error ' + response.status);
    DASH = await response.json();
    if (!hasLoaded) {
      hiddenModels.clear();
      hiddenSources.clear();
      hasLoaded = true;
    }
    renderAll();
  } catch (error) {
    if (hasLoaded && DASH) {
      console.warn('[dashboard] refresh failed:', error.message);
      return;
    }
    document.getElementById('kpiGrid').innerHTML = '<div class="alert" role="alert"><span>Failed to load token data: ' + escapeHtml(error.message) + '</span><button class="btn btn-outline btn-sm" onclick="location.reload()">Retry</button></div>';
    setTimeout(loadData, 3000);
  }
}

document.getElementById('shareBtn').onclick = shareProfile;
document.getElementById('avatarBtn').onclick = showEdit;
loadStatsPeriod();
loadData();
setInterval(loadData, 60000);
window.addEventListener('resize', function() { clearTimeout(window.__chartResize); window.__chartResize = setTimeout(function() { if (ALL_STATS) drawChart(); }, 150); });
</script>
</body>
</html>
