<script>
// Shared dashboard engine: pure data helpers with no DOM access.
// Consumed by public/index.html (single-file dashboard).
const COLORS = ['#f59e0b','#10b981','#3b82f6','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316','#6366f1','#14b8a6','#eab308','#f43f5e','#0ea5e9','#a3e635','#facc15','#c084fc','#5eead4','#fb923c','#93c5fd','#4ade80','#f87171','#2dd4bf','#a78bfa'];
const SOURCE_COLORS = ['#94a3b8','#38bdf8','#34d399','#fbbf24','#a78bfa','#fb7185'];
const SOURCE_LABELS = { codex:'Codex', opencode:'OpenCode', pi:'pi', opengrok:'OpenGrok', omp:'OMP', zcode:'ZCode', reasonix:'Reasonix', dsh:'DSH' };
const MODEL_COLORS = {};
let colorIdx = 0;
const SOURCE_COLOR_ASSIGN = {};
let sourceColorIdx = 0;

function getModelColor(m) {
  const key = m || 'unknown';
  if (!MODEL_COLORS[key]) { MODEL_COLORS[key] = COLORS[colorIdx % COLORS.length]; colorIdx++; }
  return MODEL_COLORS[key];
}
function getSourceColor(source) {
  if (!SOURCE_COLOR_ASSIGN[source]) {
    SOURCE_COLOR_ASSIGN[source] = SOURCE_COLORS[sourceColorIdx % SOURCE_COLORS.length];
    sourceColorIdx++;
  }
  return SOURCE_COLOR_ASSIGN[source];
}
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, function(ch) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}
function fmt(n) {
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(Math.round(n));
}
function fmtShort(n) {
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return Math.round(n / 1e6) + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'K';
  return String(Math.round(n));
}
function shortModel(name) {
  const value = name || 'unknown';
  if (value.length > 22) {
    const parts = value.split('/');
    return parts.length > 1 ? parts[parts.length - 1] : value.slice(0, 20) + '…';
  }
  return value;
}
function titleCase(value) {
  return value.replace(/(^|[-_])([a-z])/g, function(_, prefix, letter) { return prefix + letter.toUpperCase(); });
}
function sourceLabel(value) {
  return SOURCE_LABELS[value] || titleCase(value);
}
function dateFromIso(value) {
  const parts = value.split('-').map(Number);
  return new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
}
// Date-only math stays on UTC so adding days never drifts across a DST edge.
function isoFromUtcDate(date) {
  return date.toISOString().slice(0, 10);
}
// A real timestamp maps to the viewer's calendar day, which is what "today"
// and the daily buckets mean to whoever is reading the dashboard.
function isoDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return year + '-' + month + '-' + day;
}
function addDays(value, amount) {
  const date = dateFromIso(value);
  date.setUTCDate(date.getUTCDate() + amount);
  return isoFromUtcDate(date);
}
function daySpan(first, last) {
  if (!first || !last) return 0;
  return Math.round((dateFromIso(last) - dateFromIso(first)) / 86400000) + 1;
}
function niceMax(value) {
  if (!value || value <= 0) return 1;
  const padded = value * 1.1;
  const exponent = Math.pow(10, Math.floor(Math.log10(padded)));
  const normalized = padded / exponent;
  const step = normalized <= 1.5 ? .25 : normalized <= 3 ? .5 : normalized <= 7 ? 1 : 2;
  return Math.ceil(padded / (step * exponent)) * step * exponent;
}
// Cache reads are a separate additive bucket in every source, so the hit rate
// is the share of prompt-side tokens served from cache: read / (input + read).
// Returns null when there is no prompt-side traffic to speak of.
function cacheHitRate(input, cacheRead) {
  const promptSide = (Number(input) || 0) + (Number(cacheRead) || 0);
  if (promptSide <= 0) return null;
  return (Number(cacheRead) || 0) / promptSide * 100;
}
function cacheHitText(input, cacheRead) {
  const rate = cacheHitRate(input, cacheRead);
  return rate === null ? '—' : rate.toFixed(1) + '%';
}

const EMPTY_STATS = {totalTokens:0,totalInput:0,totalOutput:0,totalCacheRead:0,totalCacheCreation:0,activeDays:0,records:0,topModel:'N/A',topModelTokens:0,currentStreak:0,longestStreak:0,daily:[],modelRows:[],firstDate:'',lastDate:''};

function streakStats(daily) {
  if (!daily.length) return {current:0, longest:0};
  const dateSet = new Set(daily.map(function(day) { return day.date; }));
  const today = isoDate(new Date());
  let current = 0;
  if (dateSet.has(today)) {
    for (let back = 0; ; back++) {
      if (!dateSet.has(addDays(today, -back))) break;
      current++;
    }
  }
  let longest = 0;
  let run = 0;
  for (let index = 0; index < daily.length; index++) {
    if (index === 0) run = 1;
    else run = (dateFromIso(daily[index].date) - dateFromIso(daily[index - 1].date)) / 86400000 === 1 ? run + 1 : 1;
    if (run > longest) longest = run;
  }
  return {current, longest};
}

// DeepSeek Platform 風: 全体統計の期間絞り込み。null は無制限。
// Pure: period/custom are passed in instead of read from globals.
function statsPeriodWindow(days, period, custom) {
  if (period === 'custom') {
    if (custom && custom.from && custom.to && custom.from <= custom.to) {
      return {from:custom.from, to:custom.to};
    }
    return null;
  }
  if (!days || !days.length) return null;
  const span = parseInt(period, 10);
  if (period === 'all' || !isFinite(span) || span <= 0) return null;
  const last = days[days.length - 1].date;
  const first = days[0].date;
  return {from:addDays(last, -(Math.min(span, daySpan(first, last)) - 1)), to:last};
}

// Reduce the server summary to what the current filters show.
function buildView(summary, opts) {
  opts = opts || {};
  const hiddenSources = opts.hiddenSources || new Set();
  const hiddenModels = opts.hiddenModels || new Set();
  if (!summary) return Object.assign({}, EMPTY_STATS, {sourceRows:[]});
  const visible = new Set();
  for (const row of summary.sources || []) {
    if (!hiddenSources.has(row.source)) visible.add(row.source);
  }
  const win = statsPeriodWindow(summary.daily || [], opts.statsPeriod || 'all', opts.statsCustom || {from:'', to:''});
  const inWin = function(date) {
    if (!win || !win.from || !win.to) return true;
    return date >= win.from && date <= win.to;
  };

  const modelMap = new Map();
  const sourceMap = new Map();
  const dailyMap = new Map();
  let totalTokens = 0, totalInput = 0, totalOutput = 0, totalCacheRead = 0, totalCacheCreation = 0;
  let records = 0;

  const bump = function(slot, tokens, input, output, cacheRead, cacheCreation) {
    slot.tokens += tokens;
    slot.input += input;
    slot.output += output;
    slot.cacheRead += cacheRead;
    slot.cacheCreation += cacheCreation;
  };

  for (const day of summary.daily || []) {
    if (!inWin(day.date)) continue;
    let dayTotal = 0;
    let byModel = null;
    for (const point of day.points) {
      if (!visible.has(point.source)) continue;
      const tokens = point.tokens || 0;
      if (tokens <= 0) continue;
      if (hiddenModels.has(point.model)) {
        // Keep a zero row so the hidden model stays toggleable,
        // but exclude it from every aggregate like hidden sources.
        if (!modelMap.has(point.model)) modelMap.set(point.model, {model: point.model, tokens: 0, input: 0, output: 0, cacheRead: 0, cacheCreation: 0});
        continue;
      }
      const input = point.input || 0;
      const output = point.output || 0;
      const cacheRead = point.cacheRead || 0;
      const cacheCreation = point.cacheCreation || 0;
      records++;
      dayTotal += tokens;
      totalTokens += tokens;
      totalInput += input;
      totalOutput += output;
      totalCacheRead += cacheRead;
      totalCacheCreation += cacheCreation;
      if (!byModel) byModel = {};
      byModel[point.model] = (byModel[point.model] || 0) + tokens;
      let slot = modelMap.get(point.model);
      if (!slot) modelMap.set(point.model, slot = {model: point.model, tokens: 0, input: 0, output: 0, cacheRead: 0, cacheCreation: 0});
      bump(slot, tokens, input, output, cacheRead, cacheCreation);
      let srow = sourceMap.get(point.source);
      if (!srow) sourceMap.set(point.source, srow = {source: point.source, tokens: 0, input: 0, output: 0, cacheRead: 0, cacheCreation: 0});
      bump(srow, tokens, input, output, cacheRead, cacheCreation);
    }
    if (dayTotal > 0) dailyMap.set(day.date, {date: day.date, total: dayTotal, byModel: byModel || {}});
  }

  const daily = [...dailyMap.values()].sort(function(a, b) { return a.date.localeCompare(b.date); });
  const modelRows = [...modelMap.values()].sort(function(a, b) { return b.tokens - a.tokens; });
  const sourceRows = (summary.sources || []).map(function(row) {
    return sourceMap.get(row.source) || {source: row.source, tokens: 0, input: 0, output: 0, cacheRead: 0, cacheCreation: 0};
  }).sort(function(a, b) { return b.tokens - a.tokens; });
  const streak = streakStats(daily);
  const stats = Object.assign({}, EMPTY_STATS, {
    totalTokens, totalInput, totalOutput, totalCacheRead, totalCacheCreation,
    activeDays: daily.length,
    records,
    daily,
    modelRows,
    sourceRows,
    firstDate: daily.length ? daily[0].date : '',
    lastDate: daily.length ? daily[daily.length - 1].date : '',
    currentStreak: streak.current,
    longestStreak: streak.longest,
  });
  if (modelRows.length && modelRows[0].tokens > 0) {
    stats.topModel = modelRows[0].model;
    stats.topModelTokens = modelRows[0].tokens;
  }
  return stats;
}

// グラフ用の全期間日別。統計の期間フィルタとは独立で、ハーネス絞り込みのみ反映。
function chartDaily(fullDaily, visible) {
  const out = [];
  for (const day of fullDaily || []) {
    let total = 0;
    const byModel = {};
    for (const point of day.points) {
      if (!visible.has(point.source) || !(point.tokens > 0)) continue;
      total += point.tokens;
      byModel[point.model] = (byModel[point.model] || 0) + point.tokens;
    }
    if (total > 0) out.push({date: day.date, total, byModel});
  }
  return out.sort(function(a, b) { return a.date.localeCompare(b.date); });
}

function chartWindow(daily, range, rangeDays, rangeMinDays) {
  if (!daily.length) return null;
  const first = daily[0].date;
  const last = daily[daily.length - 1].date;
  const span = daySpan(first, last);
  if (range === 'all') return {from:first, to:last, days:span, clamped:false};
  const wanted = Math.min(rangeDays, Math.max(rangeMinDays, span));
  const from = span > wanted ? addDays(last, -(wanted - 1)) : first;
  return {from, to:last, days:daySpan(from, last), clamped:span < rangeDays};
}

function makeCalendarBuckets(daily, from, to) {
  const span = Math.max(0, daySpan(from, to));
  const step = span > 180 ? 7 : span > 90 ? 3 : 1;
  const byDate = new Map(daily.map(function(day) { return [day.date, day]; }));
  const buckets = [];
  for (let offset = 0; offset < span; offset += step) {
    const start = addDays(from, offset);
    const bucket = {date:start, total:0, models:{}};
    for (let index = 0; index < step && offset + index < span; index++) {
      const day = byDate.get(addDays(from, offset + index));
      if (!day) continue;
      bucket.total += day.total;
      for (const model in day.byModel) bucket.models[model] = (bucket.models[model] || 0) + day.byModel[model];
    }
    buckets.push(bucket);
  }
  return {buckets,span,step,from,to};
}

function axisLabel(value, span) {
  const date = dateFromIso(value);
  if (span <= 45) return String(date.getUTCMonth() + 1).padStart(2, '0') + '-' + String(date.getUTCDate()).padStart(2, '0');
  return date.toLocaleDateString('en-US', {month:'short', timeZone:'UTC'});
}

<script>
// ---- page state ----
let DASH = null;          // server summary payload
let ALL_STATS = null;     // current filtered view (buildView output)
let hasLoaded = false;
const hiddenModels = new Set();
const hiddenSources = new Set();
let statsPeriod = 'all';
let statsCustom = {from:'', to:''};
let chartRange = '30d';
let breakTab = 'models';
let legendExpanded = false;
let pinnedBucket = -1;
let chartView = null;
let lastSyncAt = 0;
let lastSyncError = '';
let lastDashboardId = '';
let refreshing = false;
let calTarget = 'from';
let calCursor = '';

const profileParams = new URLSearchParams(location.search);
let userName = profileParams.get('name')?.trim() || localStorage.getItem('tmx_name') || 'nico2525nn';
let avatarUrl = profileParams.get('avatar')?.trim() || localStorage.getItem('tmx_avatar') || '';

function saveStatsPeriod() {
  try {
    localStorage.setItem('tmx_stats_period', statsPeriod);
    localStorage.setItem('tmx_stats_custom', JSON.stringify(statsCustom));
  } catch {}
}
function loadStatsPeriod() {
  try {
    const saved = localStorage.getItem('tmx_stats_period');
    if (saved === '7' || saved === '30' || saved === '90' || saved === 'all' || saved === 'custom') statsPeriod = saved;
    const custom = JSON.parse(localStorage.getItem('tmx_stats_custom') || '{}');
    if (/^\d{4}-\d{2}-\d{2}$/.test(custom.from || '') && /^\d{4}-\d{2}-\d{2}$/.test(custom.to || '')) {
      // Older builds defaulted Custom to a single day (the last one with data),
      // which then persisted forever. Treat a one-day range as that leftover and
      // fall back to the last week.
      if (custom.from === custom.to) {
        const today = isoDate(new Date());
        statsCustom = {from:addDays(today, -6), to:today};
      } else {
        statsCustom = {from:custom.from, to:custom.to};
      }
    } else statsCustom = {from:'', to:''};
  } catch { statsPeriod = 'all'; statsCustom = {from:'', to:''}; }
}
const initialTab = new URLSearchParams(location.search).get('tab');
if (initialTab === 'harness') breakTab = 'harness';

// ---- stats period filter + KPI cards ----
function renderPeriod() {
  const presets = [['7','7D'],['30','30D'],['90','90D'],['all','ALL'],['custom','Custom']];
  const active = document.activeElement && (document.activeElement.id === 'customFrom' || document.activeElement.id === 'customTo') ? document.activeElement.id : null;
  const draft = active ? {
    from: document.getElementById('customFrom')?.value || '',
    to: document.getElementById('customTo')?.value || '',
  } : null;
  document.getElementById('statsRangeGroup').innerHTML = presets.map(function(p) {
    return '<button class="range-btn' + (statsPeriod === p[0] ? ' active' : '') + '" data-period="' + p[0] + '" aria-pressed="' + (statsPeriod === p[0]) + '">' + p[1] + '</button>';
  }).join('');
  document.getElementById('statsRangeGroup').querySelectorAll('button').forEach(function(btn) {
    btn.onclick = function() { setStatsPeriod(btn.dataset.period); };
  });
  const range = document.getElementById('customRange');
  const show = statsPeriod === 'custom';
  range.classList.toggle('hidden', !show);
  if (show) {
    document.getElementById('customFrom').value = draft ? draft.from : statsCustom.from;
    document.getElementById('customTo').value = draft ? draft.to : statsCustom.to;
    syncDateLabels();
    if (active) {
      const el = document.getElementById(active);
      if (el) el.focus({preventScroll:true});
    }
  }
}

function setStatsPeriod(period) {
  if (period !== '7' && period !== '30' && period !== '90' && period !== 'all' && period !== 'custom') return;
  if (statsPeriod === period) {
    if (period !== 'custom') return;
    const range = document.getElementById('customRange');
    const hidden = range.classList.contains('hidden');
    range.classList.toggle('hidden', !hidden);
    if (hidden) document.getElementById('customFrom').focus();
    else closeCustomPopover();
    return;
  }
  statsPeriod = period;
  if (period === 'custom' && (!statsCustom.from || !statsCustom.to)) {
    // Default to the last seven days ending today.
    const today = isoDate(new Date());
    statsCustom = {from:addDays(today, -6), to:today};
  }
  saveStatsPeriod();
  renderAll();
}

function renderKpis() {
  const s = ALL_STATS;
  const hit = cacheHitText(s.totalInput, s.totalCacheRead);
  const topShare = s.totalTokens > 0 ? (s.topModelTokens / s.totalTokens * 100).toFixed(1) : null;
  const topColor = s.topModel && s.topModel !== 'N/A' ? getModelColor(s.topModel) : null;
  const cards = [
    {label:'Total Tokens', value:fmt(s.totalTokens), title:String(s.totalTokens),
     sub:'<b>' + s.records + '</b> records · in <b>' + fmt(s.totalInput) + '</b> / out <b>' + fmt(s.totalOutput) + '</b>'},
    {label:'Cache Hit Rate', value:hit, title:fmt(s.totalCacheRead) + ' of ' + fmt(s.totalInput + s.totalCacheRead) + ' prompt tokens',
     sub:fmtShort(s.totalCacheRead) + ' of ' + fmtShort(s.totalInput + s.totalCacheRead) + ' prompt tokens'},
    {label:'Top Model', dot:topColor, value:s.topModel === 'N/A' ? '—' : shortModel(s.topModel), title:s.topModel, small:true,
     sub:topShare === null ? '—' : '<b>' + topShare + '%</b> of all tokens · ' + fmt(s.topModelTokens)},
    {label:'Active Days', value:String(s.activeDays), title:null,
     sub:'streak <b>' + s.currentStreak + '</b> · longest <b>' + s.longestStreak + '</b>'},

  document.getElementById('kpiGrid').innerHTML = cards.map(function(c) {
    return '<div class="card"><div class="kpi-body">'
      + '<span class="kpi-label">' + (c.dot ? '<span class="dot" style="background:' + c.dot + '"></span>' : '') + escapeHtml(c.label) + '</span>'
      + '<span class="stat-num' + (c.small ? ' stat-num-sm' : '') + '"' + (c.title ? ' title="' + escapeHtml(c.title) + '"' : '') + '>' + escapeHtml(c.value) + '</span>'
      + '<span class="stat-sub">' + c.sub + '</span>'
      + '</div></div>';
  }).join('');
}

function renderChartCard() {
  document.getElementById('chartRangeGroup').innerHTML = [['30d','30D'],['all','ALL']].map(function(p) {

// ---- breakdown tabs + tables ----
function renderBreakdown() {
  const tabDefs = [['models','Models', (ALL_STATS.modelRows || []).length], ['harness','Harness', (DASH && DASH.sources ? DASH.sources.length : 0)]];
  document.getElementById('breakTabs').innerHTML = tabDefs.map(function(t) {
    return '<button class="tabs-trigger' + (breakTab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '" role="tab" id="breakTab-' + t[0] + '" aria-selected="' + (breakTab === t[0]) + '" aria-controls="breakTableWrap" tabindex="' + (breakTab === t[0] ? '0' : '-1') + '">' + t[1] + ' <span class="tabs-badge">' + t[2] + '</span></button>';
  }).join('');
  const tabBtns = Array.prototype.slice.call(document.getElementById('breakTabs').querySelectorAll('button'));
  tabBtns.forEach(function(btn, btnIndex) {
    btn.onclick = function() { if (breakTab !== btn.dataset.tab) { breakTab = btn.dataset.tab; renderBreakdown(); } };
    btn.onkeydown = function(event) {
      let next = -1;
      if (event.key === 'ArrowRight' || event.key === 'ArrowDown') next = (btnIndex + 1) % tabBtns.length;
      else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') next = (btnIndex - 1 + tabBtns.length) % tabBtns.length;
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = tabBtns.length - 1;

      const off = hiddenModels.has(row.model) ? ' off' : '';
      const color = getModelColor(row.model);
      const share = (row.tokens / ALL_STATS.totalTokens * 100).toFixed(1);
      const cache = cacheHitText(row.input, row.cacheRead);
      return '<tr class="' + off.trim() + '" data-model="' + escapeHtml(row.model) + '" title="' + escapeHtml(row.model) + ' — cache hit ' + escapeHtml(cache) + ' of ' + escapeHtml(fmt(row.input + row.cacheRead)) + ' prompt tokens">'
        + '<td><span class="cell-name"><span class="dot" style="background:' + color + '"></span><button type="button" class="cell-toggle" data-model="' + escapeHtml(row.model) + '" aria-pressed="' + (!hiddenModels.has(row.model)) + '">' + escapeHtml(row.model) + '</button></span></td>'
        + '<td class="num">' + fmt(row.tokens) + '</td>'
        + '<td class="num">' + share + '%</td>'
        + '<td class="num">' + escapeHtml(cache) + '</td>'
        + '<td class="num cell-muted"><span class="io-full">' + fmt(row.input) + ' / ' + fmt(row.output) + '</span><span class="io-short"><i>' + fmtShort(row.input) + '</i><i>' + fmtShort(row.output) + '</i></span></td>'

    wrap.querySelectorAll('tr[data-model]').forEach(function(tr) {

      tr.onclick = function(event) { if (!event.target.closest('.cell-toggle')) toggleModel(tr.dataset.model); };
      if (control) control.onclick = function(event) { event.stopPropagation(); toggleModel(tr.dataset.model); };
    });
  } else {
    const rows = ALL_STATS.sourceRows || [];
    const total = rows.reduce(function(s, r) { return s + r.tokens; }, 0) || 1;
    const cols = '<colgroup><col class="c-name"><col class="c-tok"><col class="c-share"><col class="c-cache"><col class="c-io"></colgroup>';
    wrap.innerHTML = '<div class="table-scroll"><table class="data-table">' + cols + '<thead><tr><th>Harness</th><th class="num">Tokens</th><th class="num"><span class="th-full">Share</span><span class="th-abbr">Shr</span></th><th class="num"><span class="th-full">Cache</span><span class="th-abbr">Cch</span></th><th class="num"><span class="th-full">In / Out</span><span class="th-abbr">I/O</span></th></tr></thead><tbody>' + rows.map(function(row) {
      const off = hiddenSources.has(row.source) ? ' off' : '';
      const color = getSourceColor(row.source);
      const share = (row.tokens / total * 100).toFixed(1);
      const cache = cacheHitText(row.input, row.cacheRead);
      return '<tr class="' + off.trim() + '" data-source="' + escapeHtml(row.source) + '"' + (row.source === 'dsh' ? ' title="DSH totals are session-level and attributed to the last-prompt day, so daily spikes are approximate"' : '') + '>'
        + '<td><span class="cell-name"><span class="dot" style="background:' + color + '"></span><button type="button" class="cell-toggle" data-source="' + escapeHtml(row.source) + '" aria-pressed="' + (!hiddenSources.has(row.source)) + '">' + escapeHtml(sourceLabel(row.source)) + '</button></span></td>'

        + '<td class="num">' + share + '%</td>'

      const control = tr.querySelector('.cell-toggle');
      tr.onclick = function(event) { if (!event.target.closest('.cell-toggle')) toggleSource(tr.dataset.source); };
      if (control) control.onclick = function(event) { event.stopPropagation(); toggleSource(tr.dataset.source); };
    });
  }
}

function toggleSource(source) {
  if (!DASH || !DASH.sources || !DASH.sources.some(function(row) { return row.source === source; })) return;
  if (hiddenSources.has(source)) hiddenSources.delete(source);
  else hiddenSources.add(source);
  renderAll();
}
function toggleModel(model) {
  if (hiddenModels.has(model)) hiddenModels.delete(model);
  else hiddenModels.add(model);
  renderAll();
}

// ---- custom-range calendar popover ----
function fmtMonthLabel(value) {
  const date = dateFromIso(value);
  return date.toLocaleDateString('en-US', {month: 'long', year: 'numeric', timeZone: 'UTC'});
}
function renderCalPop() {
  const host = document.getElementById('customRange');
  if (!host) return;
  let pop = host.querySelector('.cal-pop');
  if (!pop) {
    pop = document.createElement('div');
    pop.className = 'cal-pop';
    host.appendChild(pop);
  }
  if (!calCursor) calCursor = isoDate(new Date()).slice(0, 7);
  const parts = calCursor.split('-').map(Number);
  const monthStart = calCursor + '-01';
  const daysInMonth = new Date(Date.UTC(parts[0], parts[1], 0)).getUTCDate();
  const lead = dateFromIso(monthStart).getUTCDay();
  const weeks = Math.ceil((lead + daysInMonth) / 7);
  const gridStart = addDays(monthStart, -lead);
  const today = isoDate(new Date());
  const from = statsCustom.from;
  const to = statsCustom.to;

  let html = '<div class="cal"><div class="cal-months"><div class="cal-month">'
    + '<nav class="cal-nav"><button type="button" class="cal-btn cal-prev" data-cal-nav="-1" aria-label="Previous month">‹</button>'
    + '<button type="button" class="cal-btn cal-next" data-cal-nav="1" aria-label="Next month">›</button></nav>'
    + '<div class="cal-caption"><span class="cal-caption-label">' + escapeHtml(fmtMonthLabel(monthStart)) + '</span></div>'
    + '<div class="cal-grid"><div class="cal-weekdays">';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d) { html += '<div class="cal-weekday">' + d + '</div>'; });
  html += '</div>';
  for (let week = 0; week < weeks; week++) {
    html += '<div class="cal-week">';
    for (let weekday = 0; weekday < 7; weekday++) {
      const iso = addDays(gridStart, week * 7 + weekday);
      const outside = iso.slice(0, 7) !== calCursor;
      const selected = iso === from || iso === to;
      const isToday = iso === today;
      const cellClass = 'cal-day' + (outside ? ' is-outside' : '') + (isToday ? ' is-today' : '');
      // Endpoints fill with primary; days between them sit on the accent track.
      let flag = '';
      if (selected && from && to && from !== to) flag = iso === from ? ' data-range-start="true"' : ' data-range-end="true"';
      else if (selected) flag = ' data-selected-single="true"';
      else if (from && to && iso > from && iso < to) flag = ' data-range-middle="true"';
      html += '<div class="' + cellClass + '"' + (selected ? ' data-selected="true"' : '') + '>'
        + '<button type="button" class="cal-day-btn"' + flag + ' data-cal-day="' + iso + '">'
        + Number(iso.slice(8)) + '</button></div>';
    }
    html += '</div>';
  }
  html += '</div></div></div></div>';
  pop.innerHTML = html;
  pop.querySelectorAll('[data-cal-nav]').forEach(function(btn) {
    btn.onclick = function() {
      const next = new Date(Date.UTC(parts[0], parts[1] - 1 + Number(btn.dataset.calNav), 1));
      calCursor = next.getUTCFullYear() + '-' + String(next.getUTCMonth() + 1).padStart(2, '0');
      renderCalPop();
    };
  });
  pop.querySelectorAll('[data-cal-day]').forEach(function(btn) {
    btn.onclick = function() { calPickDay(btn.dataset.calDay); };
  });
}
function calPickDay(iso) {
  if (calTarget === 'from') {
    statsCustom.from = iso;
    if (statsCustom.to && statsCustom.to < iso) statsCustom.to = iso;
    calTarget = 'to';
  } else {
    statsCustom.to = iso;
    if (statsCustom.from && statsCustom.from > iso) statsCustom.from = iso;
    calTarget = 'from';
  }
  saveStatsPeriod();
  const fromInput = document.getElementById('customFrom');
  const toInput = document.getElementById('customTo');
  if (fromInput) fromInput.value = statsCustom.from;
  if (toInput) toInput.value = statsCustom.to;
  syncDateLabels();
  statsPeriod = 'custom';
  closeCalPop();
  const range = document.getElementById('customRange');
  if (range) range.classList.remove('hidden');
  renderAll();
}
function closeCalPop() {
  const pop = document.querySelector('#customRange .cal-pop');
  if (pop) pop.remove();
}
function closeCustomPopover() {
  closeCalPop();
  const range = document.getElementById('customRange');
  if (range) range.classList.add('hidden');
}
// Phones show the dates through a compact label; the real input is an invisible
// overlay so the OS picker never opens on top of the in-page calendar.
function syncDateLabels() {
  const pairs = [['customFrom', 'fromText'], ['customTo', 'toText']];
  for (const pair of pairs) {
    const input = document.getElementById(pair[0]);
    const text = document.getElementById(pair[1]);
    if (!text) continue;
    const value = input && input.value ? input.value : '';
    text.textContent = value ? value.slice(5).replace('-', '/') : '—';
  }
}
function bindStatsCustomRange() {
  // On phones the browser also opens its own date picker on tap, which fights
  // with this calendar. Read-only inputs do not summon it, and focus still fires,
  // so the in-page calendar stays the only picker on small screens.
  const compact = window.matchMedia('(max-width: 640px)');
  const syncNativePicker = function() {
    for (const id of ['customFrom', 'customTo']) {
      const input = document.getElementById(id);
      if (input) input.readOnly = compact.matches;
    }
  };
  if (!document.body.dataset.pickerBound) {
    document.body.dataset.pickerBound = '1';
    compact.addEventListener('change', syncNativePicker);
  }
  syncNativePicker();
  for (const id of ['customFrom', 'customTo']) {
    const input = document.getElementById(id);
    if (!input || input.dataset.bound) continue;
    input.dataset.bound = '1';
    input.addEventListener('focus', function() {
      calTarget = id === 'customTo' ? 'to' : 'from';
      // Re-seed on every open so the calendar cannot stay stuck on a month
      // visited earlier in the session.
      const seed = calTarget === 'to' ? statsCustom.to : statsCustom.from;
      calCursor = /^20\d\d-\d\d-\d\d$/.test(seed || '') ? seed.slice(0, 7) : isoDate(new Date()).slice(0, 7);
      renderCalPop();
    });
    input.addEventListener('change', applyStatsCustomRange);
  }
  if (!document.body.dataset.calBound) {
    document.body.dataset.calBound = '1';
    document.addEventListener('pointerdown', function(event) {
      if (!event.target.closest('#customRange') && !event.target.closest('#statsRangeGroup')) closeCustomPopover();
    });
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeCustomPopover();
    });
  }
}
function applyStatsCustomRange() {
  const from = document.getElementById('customFrom');
  const to = document.getElementById('customTo');
  if (!from || !to || !from.value || !to.value || from.value > to.value) return;
  if (from.value !== statsCustom.from || to.value !== statsCustom.to) {
    statsCustom.from = from.value;
    statsCustom.to = to.value;
    saveStatsPeriod();
  }
  statsPeriod = 'custom';
  renderAll();
}

// ---- canvas chart (same engine as the legacy page) ----
const CHART_RANGE_DAYS = 30;
const CHART_RANGE_MIN_DAYS = 7;

function formatBucketLabel(bucket) {
  const step = chartView && chartView.calendar ? chartView.calendar.step : 1;
  return step === 1 ? bucket.date : bucket.date + ' – ' + addDays(bucket.date, step - 1);
}

function chartTipHtml(index) {
  if (!chartView) return '';
  const bucket = chartView.buckets[index];
  if (!bucket) return '';
  const label = formatBucketLabel(bucket);
  const rows = Object.entries(bucket.models)
    .filter(function(entry) { return entry[1] > 0 && !hiddenModels.has(entry[0]); })
    .sort(function(a, b) { return b[1] - a[1]; });
  const total = rows.reduce(function(sum, entry) { return sum + entry[1]; }, 0);
  let html = '<div class="chart-tip-head"><span class="chart-tip-date">' + escapeHtml(label) + '</span><span class="chart-tip-total">' + fmt(total) + '</span></div>';
  if (!rows.length) {
    html += '<p class="chart-tip-more">No token usage</p>';
  } else {
    html += '<div class="chart-tip-list">';
    rows.slice(0, 8).forEach(function(entry) {
      html += '<div class="chart-tip-row"><span class="dot" style="background:' + getModelColor(entry[0]) + '"></span><span class="chart-tip-name" title="' + escapeHtml(entry[0]) + '">' + escapeHtml(shortModel(entry[0])) + '</span><span class="chart-tip-value">' + fmt(entry[1]) + ' · ' + (entry[1] / total * 100).toFixed(1) + '%</span></div>';
    });
    html += '</div>';
    if (rows.length > 8) html += '<p class="chart-tip-more">+' + (rows.length - 8) + ' more models</p>';
  }
  html += '<p class="chart-tip-hint">' + (pinnedBucket === index ? 'Click to unpin' : 'Click to pin') + '</p>';
  return html;
}

function announceChart(index) {
  const live = document.getElementById('chartAnnounce');
  if (!live || !chartView) return;
  const bucket = chartView.buckets[index];
  if (!bucket) { live.textContent = ''; return; }
  const label = formatBucketLabel(bucket);
  const rows = Object.entries(bucket.models)
    .filter(function(entry) { return entry[1] > 0 && !hiddenModels.has(entry[0]); })
    .sort(function(a, b) { return b[1] - a[1]; })
    .slice(0, 3)
    .map(function(entry) { return shortModel(entry[0]) + ' ' + fmt(entry[1]); });
  live.textContent = label + ': ' + fmt(bucket.total) + ' tokens' + (rows.length ? ', ' + rows.join(', ') : '');
}

function hideChartTip() {
  const tip = document.querySelector('.chart-tip');
  if (tip) tip.remove();
  const canvas = document.getElementById('tokenChart');
  if (canvas) canvas.classList.remove('active');
}

function showChartTip(index, anchorX, announce) {
  const canvas = document.getElementById('tokenChart');
  if (!canvas || !chartView || index < 0 || index >= chartView.buckets.length) {
    hideChartTip();
    return;
  }
  const host = canvas.parentElement;
  let tip = host.querySelector('.chart-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.className = 'chart-tip';
    host.appendChild(tip);
  }
  tip.innerHTML = chartTipHtml(index);
  // Only explicit keyboard/click navigation should speak; hover must not
  // machine-gun the live region.
  if (announce) announceChart(index);
  const x = chartView.pad.left + index * chartView.slotWidth + chartView.barWidth / 2;
  const tipWidth = tip.offsetWidth;
  const hostWidth = host.clientWidth;
  let left = anchorX + 12;
  if (left + tipWidth > hostWidth - 4) left = x - tipWidth - 12;
  tip.style.left = Math.max(4, left) + 'px';
  tip.style.top = chartView.pad.top + 'px';
  canvas.classList.add('active');
}

function chartBucketAt(clientX) {
  const canvas = document.getElementById('tokenChart');
  if (!canvas || !chartView) return -1;
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  if (x < chartView.pad.left || x > rect.width - chartView.pad.right) return -1;
  const index = Math.floor((x - chartView.pad.left) / chartView.slotWidth);
  return index >= 0 && index < chartView.buckets.length ? index : -1;
}

function drawChart() {
  const canvas = document.getElementById('tokenChart');
  const legend = document.getElementById('chartLegend');
  if (!canvas || !legend) return;
  const visible = new Set();
  for (const row of DASH && DASH.sources ? DASH.sources : []) {
    if (!hiddenSources.has(row.source)) visible.add(row.source);
  }
  const daily = chartDaily(DASH ? DASH.daily || [] : [], visible);
  const window_ = chartWindow(daily, chartRange, CHART_RANGE_DAYS, CHART_RANGE_MIN_DAYS);
  const calendar = window_ ? makeCalendarBuckets(daily, window_.from, window_.to) : {buckets:[],span:0,step:1};
  const buckets = calendar.buckets;

  // Rank and colour models by what is actually plotted, so the legend matches
  // the bars instead of the whole history.
  const totals = {};
  buckets.forEach(function(bucket) {
    for (const model in bucket.models) totals[model] = (totals[model] || 0) + bucket.models[model];
  });
  const names = Object.keys(totals);
  const ranked = Object.entries(totals).sort(function(a,b) { return b[1] - a[1]; });
  // Legend shares use the full plotted total so hidden entries keep their
  // original share instead of inflating past 100%.
  const windowTotal = ranked.reduce(function(sum, entry) { return sum + entry[1]; }, 0);
  const colors = {};
  names.forEach(function(name) { colors[name] = getModelColor(name); });
  const chipMode = window.innerWidth <= 1024;
  const shown = legendExpanded ? ranked : ranked.slice(0, 8);
  legend.innerHTML = ranked.length ? '<div class="' + (chipMode ? 'chips' : 'chart-key-list' + (legendExpanded && ranked.length > 8 ? ' scroll' : '')) + '">' + shown.map(function(entry, index) {
    const model = entry[0];
    const off = hiddenModels.has(model) ? ' off' : '';
    const pct = (entry[1] / (windowTotal || 1) * 100).toFixed(1) + '%';
    if (chipMode) return '<button class="chip' + off + '" data-model="' + escapeHtml(model) + '" aria-pressed="' + (!hiddenModels.has(model)) + '"><span class="dot" style="background:' + colors[model] + '"></span><span class="chip-name" title="' + escapeHtml(model) + '">' + escapeHtml(shortModel(model)) + '</span><span class="chip-val">' + pct + '</span></button>';
    return '<button class="legend-item' + off + '" data-model="' + escapeHtml(model) + '" aria-pressed="' + (!hiddenModels.has(model)) + '"><span class="legend-dot" style="background:' + colors[model] + '"></span><span class="legend-name" title="' + escapeHtml(model) + '">' + escapeHtml(shortModel(model)) + '</span><span class="legend-value">' + pct + '</span></button>';
  }).join('') + '</div>' + (ranked.length > 8 ? '<button class="legend-more legend-toggle" id="legendToggle" aria-expanded="' + legendExpanded + '">' + (legendExpanded ? 'Show less' : '+' + (ranked.length - 8) + ' more') + '</button>' : '') : '<p class="card-desc">No model data</p>';
  const legendToggle = document.getElementById('legendToggle');
  if (legendToggle) legendToggle.onclick = function() { legendExpanded = !legendExpanded; drawChart(); };
  legend.querySelectorAll('button[data-model]').forEach(function(btn) {
    btn.onclick = function() { toggleModel(btn.dataset.model); };
  });

  const rangeLabel = document.getElementById('chartRangeLabel');
  if (rangeLabel) rangeLabel.textContent = window_ ? window_.from + ' – ' + window_.to : '';

  const context = canvas.getContext('2d');
  if (!daily.length) {
    chartView = null;
    pinnedBucket = -1;
    hideChartTip();
    canvas.width = 1;
    canvas.height = 1;
    canvas.style.display = 'none';
    const empty = canvas.parentElement.querySelector('.chart-empty');
    if (!empty) canvas.parentElement.insertAdjacentHTML('beforeend', '<div class="chart-empty">No token data</div>');
    return;
  }
  canvas.style.display = 'block';
  canvas.parentElement.querySelector('.chart-empty')?.remove();
  // Stack largest-first so the segment order matches the ranked legend.
  const visibleModels = ranked.map(function(entry) { return entry[0]; }).filter(function(model) { return !hiddenModels.has(model); });
  const values = buckets.map(function(bucket) { return visibleModels.reduce(function(sum, model) { return sum + (bucket.models[model] || 0); }, 0); });
  const maxValue = niceMax(Math.max.apply(Math, values.concat([0])));
  const dpr = window.devicePixelRatio || 1;
  const width = Math.max(240, canvas.parentElement.clientWidth || 600);
  const height = window.innerWidth <= 640 ? 240 : 300;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  context.setTransform(dpr, 0, 0, dpr, 0, 0);
  context.clearRect(0, 0, width, height);
  const pad = {top:12,bottom:30,left:48,right:8};
  const plotWidth = Math.max(1, width - pad.left - pad.right);
  const plotHeight = Math.max(1, height - pad.top - pad.bottom);
  const slotWidth = plotWidth / buckets.length;
  const barWidth = Math.max(2, Math.min(16, slotWidth * .86));
  context.font = '10px Inter,sans-serif';
  context.textAlign = 'right';
  const gridBase = 'hsl(240 5% 64.9%)';
  const gridLine = 'hsl(240 5% 64.9% / .28)';
  for (let tick = 0; tick <= 4; tick++) {
    const y = pad.top + plotHeight - plotHeight * tick / 4;
    context.fillStyle = gridBase;
    context.fillText(fmt(maxValue * tick / 4), pad.left - 8, y + 3);
    context.strokeStyle = tick === 0 ? 'hsl(240 5% 64.9% / .6)' : gridLine;
    context.lineWidth = 1;
    context.beginPath();
    context.moveTo(pad.left, y + .5);
    context.lineTo(width - pad.right, y + .5);
    context.stroke();
  }
  buckets.forEach(function(bucket, bucketIndex) {
    const x = pad.left + bucketIndex * slotWidth + (slotWidth - barWidth) / 2;
    let bottom = pad.top + plotHeight;
    const dayTotal = visibleModels.reduce(function(sum, model) { return sum + (bucket.models[model] || 0); }, 0);
    if (!dayTotal) {
      // Zero-activity slot: a 1px guide so empty days read as gaps, not missing bars.
      context.fillStyle = 'hsl(240 5% 64.9% / .25)';
      context.fillRect(x, pad.top + plotHeight - 1, barWidth, 1);
      return;
    }
    const segments = visibleModels.filter(function(model) { return bucket.models[model] > 0; });
    segments.forEach(function(model, segIndex) {
      const value = bucket.models[model];
      const barHeight = Math.max(1, value / maxValue * plotHeight);
      context.fillStyle = colors[model];
      const r = Math.min(2, barWidth / 2, barHeight / 2);
      const y = bottom - barHeight;
      const isTop = segIndex === segments.length - 1;
      // Overlap 1px into the segment below so fractional coordinates never
      // leave a background-colored seam between stacked segments.
      const drawHeight = barHeight + 1;
      if (typeof context.roundRect === 'function' && isTop && r > 0) {
        context.beginPath();
        context.roundRect(x, y, barWidth, drawHeight, [r, r, 0, 0]);
        context.fill();
      } else {
        context.fillRect(x, y, barWidth, drawHeight);
      }
      bottom -= barHeight;
    });
  });
  const labels = [];
  let lastMonth = -1;
  buckets.forEach(function(bucket, index) {
    const date = dateFromIso(bucket.date);
    if (calendar.span <= 45) {
      const stride = Math.max(1, Math.ceil(buckets.length / 7));
      if (index % stride === 0) labels.push({index,text:axisLabel(bucket.date,calendar.span)});
    } else if (date.getUTCMonth() !== lastMonth) {
      labels.push({index,text:axisLabel(bucket.date,calendar.span)});
      lastMonth = date.getUTCMonth();
    }
  });
  if (labels.length && labels[labels.length - 1].index === buckets.length - 1 && labels.length > 1) labels.pop();
  context.textAlign = 'center';
  context.fillStyle = 'hsl(240 5% 64.9%)';
  labels.forEach(function(label) {
    const x = pad.left + label.index * slotWidth + slotWidth / 2;
    context.fillText(label.text, x, height - 9);
  });
  chartView = {buckets, calendar, pad, slotWidth, barWidth};
  if (!canvas.dataset.tipBound) {
    canvas.dataset.tipBound = '1';
    canvas.addEventListener('mousemove', function(event) {
      if (pinnedBucket >= 0) return;
      const index = chartBucketAt(event.clientX);
      if (index < 0) {
        hideChartTip();
        return;
      }
      showChartTip(index, event.clientX - canvas.getBoundingClientRect().left);
    });
    canvas.addEventListener('mouseleave', function() {
      if (pinnedBucket < 0) hideChartTip();
    });
    canvas.addEventListener('click', function(event) {
      const index = chartBucketAt(event.clientX);
      if (index < 0) {
        pinnedBucket = -1;
        hideChartTip();
        return;
      }
      pinnedBucket = pinnedBucket === index ? -1 : index;
      if (pinnedBucket < 0) {
        hideChartTip();
        return;
      }
      showChartTip(pinnedBucket, event.clientX - canvas.getBoundingClientRect().left, true);
    });
    canvas.addEventListener('keydown', function(event) {
      if (!chartView || !chartView.buckets.length) return;
      const last = chartView.buckets.length - 1;
      let next = pinnedBucket;
      if (event.key === 'ArrowRight' || event.key === 'ArrowDown') next = pinnedBucket < 0 ? 0 : Math.min(last, pinnedBucket + 1);
      else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') next = pinnedBucket < 0 ? last : Math.max(0, pinnedBucket - 1);
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = last;
      else if (event.key === 'Escape') { pinnedBucket = -1; hideChartTip(); return; }
      else return;
      event.preventDefault();
      pinnedBucket = next;
      showChartTip(pinnedBucket, chartView.pad.left + pinnedBucket * chartView.slotWidth, true);
    });
    canvas.addEventListener('blur', function() {
      pinnedBucket = -1;
      hideChartTip();
    });
  }
  if (pinnedBucket >= 0) showChartTip(pinnedBucket, chartView.pad.left + pinnedBucket * chartView.slotWidth);
}

// ---- render root + data loading ----
function renderAll() {
  ALL_STATS = buildView(DASH, {hiddenSources, hiddenModels, statsPeriod, statsCustom});
  pinnedBucket = -1;
  document.getElementById('chartSkeleton')?.remove();
  renderPeriod();
  renderKpis();
  renderChartCard();
  renderBreakdown();
  drawChart();
  bindStatsCustomRange();
  document.getElementById('pageMeta').textContent = ALL_STATS.firstDate ? ALL_STATS.firstDate + ' – ' + ALL_STATS.lastDate + ' · ' + ALL_STATS.activeDays + ' active days' : 'No token data';
  updateSyncFooter();
  renderAvatar();
}

function updateSyncFooter() {
  const el = document.getElementById('footerMeta');
  if (!el) return;
  let text = 'Local data · auto refresh 60s' + (ALL_STATS && ALL_STATS.firstDate ? ' · ' + ALL_STATS.firstDate + ' – ' + ALL_STATS.lastDate : '');
  if (refreshing) text += ' · refreshing…';
  else if (DASH && DASH.partial) text += ' · archives still loading';
  else if (lastSyncError) text += ' · update failed ' + lastSyncError;
  else if (lastSyncAt) text += ' · updated ' + new Date(lastSyncAt).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  el.textContent = text;
}

async function loadData(options) {
  const force = !!(options && options.force);
  refreshing = true;
  updateSyncFooter();
  try {
    // A forced load re-reads the logs server-side, so opening the page shows
    // fresh numbers instead of waiting for the next scheduled pass.
    const response = await fetch(force ? '/api/refresh' : '/api/dashboard', {cache:'no-store'});
    if (response.status === 503) throw Error('still building the first snapshot — retrying');
    if (!response.ok) throw Error('API error ' + response.status);
    DASH = await response.json();
    lastSyncAt = Date.now();
    lastSyncError = '';
    if (!hasLoaded) {
      hiddenModels.clear();
      hiddenSources.clear();
      hasLoaded = true;
    }
    refreshing = false;
    if (DASH.generatedAt && DASH.generatedAt === lastDashboardId) {
      updateSyncFooter();
      return;
    }
    lastDashboardId = DASH.generatedAt || '';
    renderAll();
  } catch (error) {
    refreshing = false;
    if (hasLoaded && DASH) {
      lastSyncError = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      updateSyncFooter();
      console.warn('[dashboard] refresh failed:', error.message);
      return;
    }
    document.getElementById('kpiGrid').innerHTML = '<div class="alert" role="alert"><span>Failed to load token data: ' + escapeHtml(error.message) + '</span><button class="btn btn-outline btn-sm" onclick="location.reload()">Retry</button></div>';
    setTimeout(loadData, 3000);
  }
}

document.getElementById('avatarBtn').onclick = function() { toggleAvatarMenu(); };
document.getElementById('menuEdit').onclick = function() { toggleAvatarMenu(false); showEdit(); };
document.addEventListener('pointerdown', function(event) {
  if (!event.target.closest('.topbar-right')) toggleAvatarMenu(false);
});
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') toggleAvatarMenu(false);
});
loadStatsPeriod();
loadData({force: true});
setInterval(function() { loadData(); }, 60000);
window.addEventListener('resize', function() { clearTimeout(window.__chartResize); window.__chartResize = setTimeout(function() { if (ALL_STATS) drawChart(); }, 150); });
</script>
