<script>
// ---- page state ----
let DASH = null;          // server summary payload
let ALL_STATS = null;     // current filtered view (buildView output)
let hasLoaded = false;
const hiddenModels = new Set();
const hiddenSources = new Set();
let statsPeriod = 'all';
let statsCustom = {from:'', to:''};
let chartRange = '30d';
let breakTab = 'models';
let pinnedBucket = -1;
let chartView = null;
let calTarget = 'from';
let calCursor = '';

const profileParams = new URLSearchParams(location.search);
let userName = profileParams.get('name')?.trim() || localStorage.getItem('tmx_name') || 'nico2525nn';
let avatarUrl = profileParams.get('avatar')?.trim() || localStorage.getItem('tmx_avatar') || 'https://avatars.githubusercontent.com/u/173241093?v=4';

function saveStatsPeriod() {
  try {
    localStorage.setItem('tmx_stats_period', statsPeriod);
    localStorage.setItem('tmx_stats_custom', JSON.stringify(statsCustom));
  } catch {}
}
function loadStatsPeriod() {
  try {
    const saved = localStorage.getItem('tmx_stats_period');
    if (saved === '7' || saved === '30' || saved === '90' || saved === 'all' || saved === 'custom') statsPeriod = saved;
    const custom = JSON.parse(localStorage.getItem('tmx_stats_custom') || '{}');
    if (/^\d{4}-\d{2}-\d{2}$/.test(custom.from || '') && /^\d{4}-\d{2}-\d{2}$/.test(custom.to || '')) statsCustom = {from:custom.from, to:custom.to};
    else statsCustom = {from:'', to:''};
  } catch { statsPeriod = 'all'; statsCustom = {from:'', to:''}; }
}
const initialTab = new URLSearchParams(location.search).get('tab');
if (initialTab === 'harness') breakTab = 'harness';

// ---- stats period filter + KPI cards ----
function renderPeriod() {
  const presets = [['7','7D'],['30','30D'],['90','90D'],['all','ALL'],['custom','Custom']];
  const active = document.activeElement && (document.activeElement.id === 'customFrom' || document.activeElement.id === 'customTo') ? document.activeElement.id : null;
  const draft = active ? {
    from: document.getElementById('customFrom')?.value || '',
    to: document.getElementById('customTo')?.value || '',
  } : null;
  document.getElementById('statsRangeGroup').innerHTML = presets.map(function(p) {
    return '<button class="range-btn' + (statsPeriod === p[0] ? ' active' : '') + '" data-period="' + p[0] + '" aria-pressed="' + (statsPeriod === p[0]) + '">' + p[1] + '</button>';
  }).join('');
  document.getElementById('statsRangeGroup').querySelectorAll('button').forEach(function(btn) {
    btn.onclick = function() { setStatsPeriod(btn.dataset.period); };
  });
  const range = document.getElementById('customRange');
  const show = statsPeriod === 'custom';
  range.classList.toggle('hidden', !show);
  if (show) {
    document.getElementById('customFrom').value = draft ? draft.from : statsCustom.from;
    document.getElementById('customTo').value = draft ? draft.to : statsCustom.to;
    if (active) {
      const el = document.getElementById(active);
      if (el) el.focus({preventScroll:true});
    }
  }
}

function setStatsPeriod(period) {
  if (period !== '7' && period !== '30' && period !== '90' && period !== 'all' && period !== 'custom') return;
  if (statsPeriod === period) {
    if (period !== 'custom') return;
    const range = document.getElementById('customRange');
    const hidden = range.classList.contains('hidden');
    range.classList.toggle('hidden', !hidden);
    if (hidden) document.getElementById('customFrom').focus();
    else closeCustomPopover();
    return;
  }
  statsPeriod = period;
  if (period === 'custom' && (!statsCustom.from || !statsCustom.to)) {
    const days = DASH ? DASH.daily || [] : [];
    if (days.length) statsCustom = {from:days[days.length - 1].date, to:days[days.length - 1].date};
  }
  saveStatsPeriod();
  renderAll();
}

function renderKpis() {
  const s = ALL_STATS;
  const hit = cacheHitText(s.totalInput, s.totalCacheRead);
  const topShare = s.totalTokens > 0 ? (s.topModelTokens / s.totalTokens * 100).toFixed(1) : null;
  const topColor = s.topModel && s.topModel !== 'N/A' ? getModelColor(s.topModel) : null;
  const cards = [
    {label:'Total Tokens', value:fmt(s.totalTokens), title:String(s.totalTokens),
     sub:'<b>' + s.sessions + '</b> sessions · in <b>' + fmt(s.totalInput) + '</b> / out <b>' + fmt(s.totalOutput) + '</b>'},
    {label:'Cache Hit Rate', value:hit, title:fmt(s.totalCacheRead) + ' of ' + fmt(s.totalInput + s.totalCacheRead) + ' prompt tokens',
     sub:fmtShort(s.totalCacheRead) + ' of ' + fmtShort(s.totalInput + s.totalCacheRead) + ' prompt tokens'},
    {label:'Top Model', dot:topColor, value:s.topModel === 'N/A' ? '—' : shortModel(s.topModel), title:s.topModel, small:true,
     sub:topShare === null ? '—' : '<b>' + topShare + '%</b> of all tokens · ' + fmt(s.topModelTokens)},
    {label:'Active Days', value:String(s.activeDays), title:null,
     sub:'streak <b>' + s.currentStreak + '</b> · longest <b>' + s.longestStreak + '</b>'},
  ];
  document.getElementById('kpiGrid').innerHTML = cards.map(function(c) {
    return '<div class="card"><div class="kpi-body">'
      + '<span class="kpi-label">' + (c.dot ? '<span class="dot" style="background:' + c.dot + '"></span>' : '') + escapeHtml(c.label) + '</span>'
      + '<span class="stat-num' + (c.small ? ' stat-num-sm' : '') + '"' + (c.title ? ' title="' + escapeHtml(c.title) + '"' : '') + '>' + escapeHtml(c.value) + '</span>'
      + '<span class="stat-sub">' + c.sub + '</span>'
      + '</div></div>';
  }).join('');
}

function renderChartCard() {
  document.getElementById('chartRangeGroup').innerHTML = [['30d','30D'],['all','ALL']].map(function(p) {
    return '<button class="range-btn' + (chartRange === p[0] ? ' active' : '') + '" data-range="' + p[0] + '" aria-pressed="' + (chartRange === p[0]) + '">' + p[1] + '</button>';
  }).join('');
  document.getElementById('chartRangeGroup').querySelectorAll('button').forEach(function(btn) {
    btn.onclick = function() { setChartRange(btn.dataset.range); };
  });
}

function setChartRange(range) {
  if (range !== 'all' && range !== '30d') return;
  if (chartRange === range) return;
  chartRange = range;
  pinnedBucket = -1;
  hideChartTip();
  renderChartCard();
  drawChart();
}

// ---- breakdown tabs + tables ----
function renderBreakdown() {
  const tabDefs = [['models','Models', (ALL_STATS.modelRows || []).length], ['harness','Harness', (DASH && DASH.sources ? DASH.sources.length : 0)]];
  document.getElementById('breakTabs').innerHTML = tabDefs.map(function(t) {
    return '<button class="tabs-trigger' + (breakTab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '" role="tab" aria-selected="' + (breakTab === t[0]) + '">' + t[1] + ' <span class="tabs-badge">' + t[2] + '</span></button>';
  }).join('');
  document.getElementById('breakTabs').querySelectorAll('button').forEach(function(btn) {
    btn.onclick = function() { if (breakTab !== btn.dataset.tab) { breakTab = btn.dataset.tab; renderBreakdown(); } };
  });
  const wrap = document.getElementById('breakTableWrap');
  if (!ALL_STATS.totalTokens) {
    wrap.innerHTML = '<p class="card-desc">No models detected</p>';
    return;
  }
  if (breakTab === 'models') {
    const rows = ALL_STATS.modelRows || [];
    const cols = '<colgroup><col class="c-name"><col class="c-tok"><col class="c-share"><col class="c-cache"><col class="c-io"></colgroup>';
    wrap.innerHTML = '<div class="table-scroll"><table class="data-table">' + cols + '<thead><tr><th>Model</th><th class="num">Tokens</th><th class="num-r"><span class="th-full">Share</span><span class="th-abbr">Shr</span></th><th class="num-r"><span class="th-full">Cache</span><span class="th-abbr">Cch</span></th><th class="num"><span class="th-full">In / Out</span><span class="th-abbr">I/O</span></th></tr></thead><tbody>' + rows.map(function(row) {
      const off = hiddenModels.has(row.model) ? ' off' : '';
      const color = getModelColor(row.model);
      const share = (row.tokens / ALL_STATS.totalTokens * 100).toFixed(1);
      const cache = cacheHitText(row.input, row.cacheRead);
      return '<tr class="' + off.trim() + '" data-model="' + escapeHtml(row.model) + '" title="' + escapeHtml(row.model) + ' — cache hit ' + escapeHtml(cache) + ' of ' + escapeHtml(fmt(row.input + row.cacheRead)) + ' prompt tokens">'
        + '<td><span class="cell-name"><span class="dot" style="background:' + color + '"></span><span>' + escapeHtml(row.model) + '</span></span></td>'
        + '<td class="num">' + fmt(row.tokens) + '</td>'
        + '<td class="num-r"><span class="cell-share"><span class="progress"><span class="progress-bar" style="width:' + share + '%;background:' + color + '"></span></span><span class="share-pct">' + share + '%</span></span></td>'
        + '<td class="num">' + escapeHtml(cache) + '</td>'
        + '<td class="num cell-muted"><span class="io-full">' + fmt(row.input) + ' / ' + fmt(row.output) + '</span><span class="io-short"><i>' + fmtShort(row.input) + '</i><i>' + fmtShort(row.output) + '</i></span></td>'
        + '</tr>';
    }).join('') + '</tbody></table></div>';
    wrap.querySelectorAll('tr[data-model]').forEach(function(tr) {
      tr.onclick = function() { toggleModel(tr.dataset.model); };
    });
  } else {
    const rows = ALL_STATS.sourceRows || [];
    const total = rows.reduce(function(s, r) { return s + r.tokens; }, 0) || 1;
    const cols = '<colgroup><col class="c-name"><col class="c-tok"><col class="c-share"><col class="c-cache"><col class="c-io"></colgroup>';
    wrap.innerHTML = '<div class="table-scroll"><table class="data-table">' + cols + '<thead><tr><th>Harness</th><th class="num">Tokens</th><th class="num-r"><span class="th-full">Share</span><span class="th-abbr">Shr</span></th><th class="num-r"><span class="th-full">Cache</span><span class="th-abbr">Cch</span></th><th class="num"><span class="th-full">In / Out</span><span class="th-abbr">I/O</span></th></tr></thead><tbody>' + rows.map(function(row) {
      const off = hiddenSources.has(row.source) ? ' off' : '';
      const color = getSourceColor(row.source);
      const share = (row.tokens / total * 100).toFixed(1);
      const cache = cacheHitText(row.input, row.cacheRead);
      return '<tr class="' + off.trim() + '" data-source="' + escapeHtml(row.source) + '">'
        + '<td><span class="cell-name"><span class="dot" style="background:' + color + '"></span><span>' + escapeHtml(sourceLabel(row.source)) + '</span></span></td>'
        + '<td class="num">' + fmt(row.tokens) + '</td>'
        + '<td class="num-r"><span class="cell-share"><span class="progress"><span class="progress-bar" style="width:' + share + '%;background:' + color + '"></span></span><span class="share-pct">' + share + '%</span></span></td>'
        + '<td class="num">' + escapeHtml(cache) + '</td>'
        + '<td class="num cell-muted"><span class="io-full">' + fmt(row.input) + ' / ' + fmt(row.output) + '</span><span class="io-short"><i>' + fmtShort(row.input) + '</i><i>' + fmtShort(row.output) + '</i></span></td>'
        + '</tr>';
    }).join('') + '</tbody></table></div>';
    wrap.querySelectorAll('tr[data-source]').forEach(function(tr) {
      tr.onclick = function() { toggleSource(tr.dataset.source); };
    });
  }
}

function toggleSource(source) {
  if (!DASH || !DASH.sources || !DASH.sources.some(function(row) { return row.source === source; })) return;
  if (hiddenSources.has(source)) hiddenSources.delete(source);
  else hiddenSources.add(source);
  renderAll();
}
function toggleModel(model) {
  if (hiddenModels.has(model)) hiddenModels.delete(model);
  else hiddenModels.add(model);
  drawChart();
  renderBreakdown();
}

// ---- custom-range calendar popover ----
function calOpenDays() {
  const days = DASH && DASH.daily ? DASH.daily.map(function(d) { return d.date; }) : [];
  return {first:days.length ? days[0] : isoDate(new Date()), last:days.length ? days[days.length - 1] : isoDate(new Date())};
}
function fmtMonthLabel(value) {
  const parts = value.split('-').map(Number);
  return parts[0] + '-' + String(parts[1]).padStart(2, '0');
}
function renderCalPop() {
  const host = document.getElementById('customRange');
  if (!host) return;
  let pop = host.querySelector('.cal-pop');
  if (!pop) {
    pop = document.createElement('div');
    pop.className = 'cal-pop';
    host.appendChild(pop);
  }
  const bounds = calOpenDays();
  if (!calCursor || calCursor < bounds.first.slice(0, 7) || calCursor > bounds.last.slice(0, 7)) {
    const seed = calTarget === 'to' ? statsCustom.to : statsCustom.from;
    calCursor = /^20\d\d-\d\d-\d\d$/.test(seed || '') ? seed.slice(0, 7) : statsCustom.to ? statsCustom.to.slice(0, 7) : statsCustom.from ? statsCustom.from.slice(0, 7) : bounds.last.slice(0, 7);
  }
  const parts = calCursor.split('-').map(Number);
  const monthFirst = new Date(Date.UTC(parts[0], parts[1] - 1, 1));
  const leadBlanks = monthFirst.getUTCDay();
  const daysInMonth = new Date(Date.UTC(parts[0], parts[1], 0)).getUTCDate();
  const today = isoDate(new Date());
  let html = '<div class="cal-head"><button class="cal-nav" data-cal-nav="-1" aria-label="Previous month">‹</button><span class="cal-title">' + fmtMonthLabel(calCursor + '-01') + '</span><button class="cal-nav" data-cal-nav="1" aria-label="Next month">›</button></div><div class="cal-grid">';
  ['S','M','T','W','T','F','S'].forEach(function(d) { html += '<span class="cal-dow">' + d + '</span>'; });
  for (let blank = 0; blank < leadBlanks; blank++) html += '<span class="cal-day dim">·</span>';
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = calCursor + '-' + String(day).padStart(2, '0');
    let cls = 'cal-day';
    if (iso === today) cls += ' today';
    const from = statsCustom.from, to = statsCustom.to;
    if (iso === from || iso === to) cls += ' picked';
    else if (from && to && iso > from && iso < to) cls += ' in-range';
    html += '<button class="' + cls + '" data-cal-day="' + iso + '">' + day + '</button>';
  }
  html += '</div>';
  pop.innerHTML = html;
  pop.querySelectorAll('[data-cal-nav]').forEach(function(btn) {
    btn.onclick = function() {
      const next = new Date(Date.UTC(parts[0], parts[1] - 1 + Number(btn.dataset.calNav), 1));
      calCursor = isoDate(next).slice(0, 7);
      renderCalPop();
    };
  });
  pop.querySelectorAll('[data-cal-day]').forEach(function(btn) {
    btn.onclick = function() { calPickDay(btn.dataset.calDay); };
  });
}
function calPickDay(iso) {
  if (calTarget === 'from') {
    statsCustom.from = iso;
    if (statsCustom.to && statsCustom.to < iso) statsCustom.to = iso;
    calTarget = 'to';
  } else {
    statsCustom.to = iso;
    if (statsCustom.from && statsCustom.from > iso) statsCustom.from = iso;
    calTarget = 'from';
  }
  saveStatsPeriod();
  const fromInput = document.getElementById('customFrom');
  const toInput = document.getElementById('customTo');
  if (fromInput) fromInput.value = statsCustom.from;
  if (toInput) toInput.value = statsCustom.to;
  statsPeriod = 'custom';
  closeCalPop();
  const range = document.getElementById('customRange');
  if (range) range.classList.remove('hidden');
  renderAll();
}
function closeCalPop() {
  const pop = document.querySelector('#customRange .cal-pop');
  if (pop) pop.remove();
}
function closeCustomPopover() {
  closeCalPop();
  const range = document.getElementById('customRange');
  if (range) range.classList.add('hidden');
}
function bindStatsCustomRange() {
  for (const id of ['customFrom', 'customTo']) {
    const input = document.getElementById(id);
    if (!input || input.dataset.bound) continue;
    input.dataset.bound = '1';
    input.addEventListener('focus', function() {
      calTarget = id === 'customTo' ? 'to' : 'from';
      const seed = calTarget === 'to' ? statsCustom.to : statsCustom.from;
      if (/^20\d\d-\d\d-\d\d$/.test(seed || '')) calCursor = seed.slice(0, 7);
      renderCalPop();
    });
    input.addEventListener('change', applyStatsCustomRange);
  }
  if (!document.body.dataset.calBound) {
    document.body.dataset.calBound = '1';
    document.addEventListener('pointerdown', function(event) {
      if (!event.target.closest('#customRange') && !event.target.closest('#statsRangeGroup')) closeCustomPopover();
    });
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeCustomPopover();
    });
  }
}
function applyStatsCustomRange() {
  const from = document.getElementById('customFrom');
  const to = document.getElementById('customTo');
  if (!from || !to || !from.value || !to.value || from.value > to.value) return;
  if (from.value !== statsCustom.from || to.value !== statsCustom.to) {
    statsCustom.from = from.value;
    statsCustom.to = to.value;
    saveStatsPeriod();
  }
  statsPeriod = 'custom';
  renderAll();
}

// ---- profile menu + edit dialog ----
function renderAvatar() {
  const btn = document.getElementById('avatarBtn');
  if (!btn) return;
  btn.innerHTML = '<img src="' + escapeHtml(avatarUrl) + '" alt="' + escapeHtml(userName) + ' avatar" onerror="this.outerHTML=\'<span>' + escapeHtml((userName[0] || '?').toUpperCase()) + '</span>\'">';
}
function showEdit() {
  const root = document.getElementById('dialogRoot');
  root.innerHTML = '<div class="dialog-overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="Edit profile"><h3>Edit profile</h3><p class="dialog-desc">Stored in this browser only. URL params override it.</p><label for="edNm">Name</label><input id="edNm" value="' + escapeHtml(userName) + '"><label for="edAv">Avatar URL</label><input id="edAv" value="' + escapeHtml(avatarUrl) + '"><div class="dialog-actions"><button class="btn btn-outline btn-sm" id="edCancel">Cancel</button><button class="btn btn-default btn-sm" id="edSave">Save changes</button></div></div></div>';
  document.getElementById('edCancel').onclick = function() { root.innerHTML = ''; };
  document.getElementById('edSave').onclick = function() { saveEdit(); };
  root.querySelector('.dialog-overlay').addEventListener('pointerdown', function(e) { if (e.target.classList.contains('dialog-overlay')) root.innerHTML = ''; });
}
function saveEdit() {
  const name = document.getElementById('edNm').value.trim() || 'nico2525nn';
  const avatar = document.getElementById('edAv').value.trim() || 'https://avatars.githubusercontent.com/u/173241093?v=4';
  userName = name;
  avatarUrl = avatar;
  localStorage.setItem('tmx_name', name);
  localStorage.setItem('tmx_avatar', avatar);
  document.getElementById('dialogRoot').innerHTML = '';
  renderAll();
}
function toggleAvatarMenu(force) {
  const menu = document.getElementById('avatarMenu');
  const btn = document.getElementById('avatarBtn');
  if (!menu || !btn) return;
  const show = typeof force === 'boolean' ? force : menu.classList.contains('hidden');
  menu.classList.toggle('hidden', !show);
  btn.setAttribute('aria-expanded', String(show));
  if (show) document.getElementById('avatarMenuName').textContent = userName;
}

// ---- canvas chart (same engine as the legacy page) ----
const CHART_RANGE_DAYS = 30;
const CHART_RANGE_MIN_DAYS = 7;

function chartTipHtml(index) {
  if (!chartView) return '';
  const bucket = chartView.buckets[index];
  if (!bucket) return '';
  const start = bucket.date;
  const step = chartView.calendar.step;
  const label = step === 1 ? start : start + ' – ' + addDays(start, step - 1);
  const rows = Object.entries(bucket.models)
    .filter(function(entry) { return entry[1] > 0 && !hiddenModels.has(entry[0]); })
    .sort(function(a, b) { return b[1] - a[1]; });
  const total = rows.reduce(function(sum, entry) { return sum + entry[1]; }, 0);
  let html = '<div class="chart-tip-head"><span class="chart-tip-date">' + escapeHtml(label) + '</span><span class="chart-tip-total">' + fmt(total) + '</span></div>';
  if (!rows.length) {
    html += '<p class="chart-tip-more">No token usage</p>';
  } else {
    html += '<div class="chart-tip-list">';
    rows.slice(0, 8).forEach(function(entry) {
      html += '<div class="chart-tip-row"><span class="dot" style="background:' + getModelColor(entry[0]) + '"></span><span class="chart-tip-name" title="' + escapeHtml(entry[0]) + '">' + escapeHtml(shortModel(entry[0])) + '</span><span class="chart-tip-value">' + (entry[1] / total * 100).toFixed(1) + '%</span></div>';
    });
    html += '</div>';
    if (rows.length > 8) html += '<p class="chart-tip-more">+' + (rows.length - 8) + ' more models</p>';
  }
  html += '<p class="chart-tip-hint">' + (pinnedBucket === index ? 'Click to unpin' : 'Click to pin') + '</p>';
  return html;
}

function hideChartTip() {
  const tip = document.querySelector('.chart-tip');
  if (tip) tip.remove();
  const canvas = document.getElementById('tokenChart');
  if (canvas) canvas.classList.remove('active');
}

function showChartTip(index, anchorX) {
  const canvas = document.getElementById('tokenChart');
  if (!canvas || !chartView || index < 0 || index >= chartView.buckets.length) {
    hideChartTip();
    return;
  }
  const host = canvas.parentElement;
  let tip = host.querySelector('.chart-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.className = 'chart-tip';
    host.appendChild(tip);
  }
  tip.innerHTML = chartTipHtml(index);
  const x = chartView.pad.left + index * chartView.slotWidth + chartView.barWidth / 2;
  const tipWidth = tip.offsetWidth;
  const hostWidth = host.clientWidth;
  let left = anchorX + 12;
  if (left + tipWidth > hostWidth - 4) left = x - tipWidth - 12;
  tip.style.left = Math.max(4, left) + 'px';
  tip.style.top = chartView.pad.top + 'px';
  canvas.classList.add('active');
}

function chartBucketAt(clientX) {
  const canvas = document.getElementById('tokenChart');
  if (!canvas || !chartView) return -1;
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  if (x < chartView.pad.left || x > rect.width - chartView.pad.right) return -1;
  const index = Math.floor((x - chartView.pad.left) / chartView.slotWidth);
  return index >= 0 && index < chartView.buckets.length ? index : -1;
}

function drawChart() {
  const canvas = document.getElementById('tokenChart');
  const legend = document.getElementById('chartLegend');
  if (!canvas || !legend) return;
  const visible = new Set();
  for (const row of DASH && DASH.sources ? DASH.sources : []) {
    if (!hiddenSources.has(row.source)) visible.add(row.source);
  }
  const daily = chartDaily(DASH ? DASH.daily || [] : [], visible);
  const window_ = chartWindow(daily, chartRange, CHART_RANGE_DAYS, CHART_RANGE_MIN_DAYS);
  const calendar = window_ ? makeCalendarBuckets(daily, window_.from, window_.to) : {buckets:[],span:0,step:1};
  const buckets = calendar.buckets;

  // Rank and colour models by what is actually plotted, so the legend matches
  // the bars instead of the whole history.
  const totals = {};
  buckets.forEach(function(bucket) {
    for (const model in bucket.models) totals[model] = (totals[model] || 0) + bucket.models[model];
  });
  const names = Object.keys(totals);
  const ranked = Object.entries(totals).sort(function(a,b) { return b[1] - a[1]; });
  // Legend shares use only visible models so the percentages match the bars.
  const visibleWindowTotal = ranked.reduce(function(sum, entry) { return sum + (hiddenModels.has(entry[0]) ? 0 : entry[1]); }, 0);
  const colors = {};
  names.forEach(function(name) { colors[name] = getModelColor(name); });
  const chipMode = window.innerWidth <= 1024;
  legend.innerHTML = ranked.length ? '<div class="' + (chipMode ? 'chips' : 'chart-key-list') + '">' + ranked.slice(0, 8).map(function(entry, index) {
    const model = entry[0];
    const off = hiddenModels.has(model) ? ' off' : '';
    const pct = (entry[1] / (visibleWindowTotal || 1) * 100).toFixed(1) + '%';
    if (chipMode) return '<button class="chip' + off + '" data-model="' + escapeHtml(model) + '" aria-pressed="' + (!hiddenModels.has(model)) + '"><span class="dot" style="background:' + colors[model] + '"></span><span class="chip-name" title="' + escapeHtml(model) + '">' + escapeHtml(shortModel(model)) + '</span><span class="chip-val">' + pct + '</span></button>';
    return '<button class="legend-item' + off + '" data-model="' + escapeHtml(model) + '" aria-pressed="' + (!hiddenModels.has(model)) + '"><span class="legend-dot" style="background:' + colors[model] + '"></span><span class="legend-name" title="' + escapeHtml(model) + '">' + escapeHtml(shortModel(model)) + '</span><span class="legend-value">' + pct + '</span></button>';
  }).join('') + '</div>' + (ranked.length > 8 ? '<p class="legend-more">+' + (ranked.length - 8) + ' more in breakdown</p>' : '') + '<p class="legend-more">Shares of the plotted window</p>' : '<p class="card-desc">No model data</p>';
  legend.querySelectorAll('button[data-model]').forEach(function(btn) {
    btn.onclick = function() { toggleModel(btn.dataset.model); };
  });

  const rangeLabel = document.getElementById('chartRangeLabel');
  if (rangeLabel) rangeLabel.textContent = window_ ? window_.from + ' – ' + window_.to : '';

  const context = canvas.getContext('2d');
  if (!daily.length) {
    chartView = null;
    pinnedBucket = -1;
    hideChartTip();
    canvas.width = 1;
    canvas.height = 1;
    canvas.style.display = 'none';
    const empty = canvas.parentElement.querySelector('.chart-empty');
    if (!empty) canvas.parentElement.insertAdjacentHTML('beforeend', '<div class="chart-empty">No token data</div>');
    return;
  }
  canvas.style.display = 'block';
  canvas.parentElement.querySelector('.chart-empty')?.remove();
  // Stack largest-first so the segment order matches the ranked legend.
  const visibleModels = ranked.map(function(entry) { return entry[0]; }).filter(function(model) { return !hiddenModels.has(model); });
  const values = buckets.map(function(bucket) { return visibleModels.reduce(function(sum, model) { return sum + (bucket.models[model] || 0); }, 0); });
  const maxValue = niceMax(Math.max.apply(Math, values.concat([0])));
  const dpr = window.devicePixelRatio || 1;
  const width = Math.max(240, canvas.parentElement.clientWidth || 600);
  const height = window.innerWidth <= 640 ? 240 : 300;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  context.setTransform(dpr, 0, 0, dpr, 0, 0);
  context.clearRect(0, 0, width, height);
  const pad = {top:12,bottom:30,left:48,right:8};
  const plotWidth = Math.max(1, width - pad.left - pad.right);
  const plotHeight = Math.max(1, height - pad.top - pad.bottom);
  const slotWidth = plotWidth / buckets.length;
  const barWidth = Math.max(2, Math.min(16, slotWidth * .86));
  context.font = '10px Inter,sans-serif';
  context.textAlign = 'right';
  const gridBase = 'hsl(240 5% 64.9%)';
  const gridLine = 'hsl(240 5% 64.9% / .28)';
  for (let tick = 0; tick <= 4; tick++) {
    const y = pad.top + plotHeight - plotHeight * tick / 4;
    context.fillStyle = gridBase;
    context.fillText(fmt(maxValue * tick / 4), pad.left - 8, y + 3);
    context.strokeStyle = tick === 0 ? 'hsl(240 5% 64.9% / .6)' : gridLine;
    context.lineWidth = 1;
    context.beginPath();
    context.moveTo(pad.left, y + .5);
    context.lineTo(width - pad.right, y + .5);
    context.stroke();
  }
  buckets.forEach(function(bucket, bucketIndex) {
    const x = pad.left + bucketIndex * slotWidth + (slotWidth - barWidth) / 2;
    let bottom = pad.top + plotHeight;
    const dayTotal = visibleModels.reduce(function(sum, model) { return sum + (bucket.models[model] || 0); }, 0);
    if (!dayTotal) {
      // Zero-activity slot: a 1px guide so empty days read as gaps, not missing bars.
      context.fillStyle = 'hsl(240 5% 64.9% / .25)';
      context.fillRect(x, pad.top + plotHeight - 1, barWidth, 1);
      return;
    }
    visibleModels.forEach(function(model) {
      const value = bucket.models[model] || 0;
      if (!value) return;
      const barHeight = Math.max(1, value / maxValue * plotHeight);
      context.fillStyle = colors[model];
      const r = Math.min(2, barWidth / 2, barHeight / 2);
      const y = bottom - barHeight;
      if (typeof context.roundRect === 'function') {
        context.beginPath();
        context.roundRect(x, y, barWidth, barHeight, r);
        context.fill();
      } else {
        context.fillRect(x, y, barWidth, barHeight);
      }
      bottom -= barHeight;
    });
  });
  const labels = [];
  let lastMonth = -1;
  buckets.forEach(function(bucket, index) {
    const date = dateFromIso(bucket.date);
    if (calendar.span <= 45) {
      const stride = Math.max(1, Math.ceil(buckets.length / 7));
      if (index % stride === 0) labels.push({index,text:axisLabel(bucket.date,calendar.span)});
    } else if (date.getUTCMonth() !== lastMonth) {
      labels.push({index,text:axisLabel(bucket.date,calendar.span)});
      lastMonth = date.getUTCMonth();
    }
  });
  if (labels.length && labels[labels.length - 1].index === buckets.length - 1 && labels.length > 1) labels.pop();
  context.textAlign = 'center';
  context.fillStyle = 'hsl(240 5% 64.9%)';
  labels.forEach(function(label) {
    const x = pad.left + label.index * slotWidth + slotWidth / 2;
    context.fillText(label.text, x, height - 9);
  });
  chartView = {buckets, calendar, pad, slotWidth, barWidth};
  if (!canvas.dataset.tipBound) {
    canvas.dataset.tipBound = '1';
    canvas.addEventListener('mousemove', function(event) {
      if (pinnedBucket >= 0) return;
      const index = chartBucketAt(event.clientX);
      if (index < 0) {
        hideChartTip();
        return;
      }
      showChartTip(index, event.clientX - canvas.getBoundingClientRect().left);
    });
    canvas.addEventListener('mouseleave', function() {
      if (pinnedBucket < 0) hideChartTip();
    });
    canvas.addEventListener('click', function(event) {
      const index = chartBucketAt(event.clientX);
      if (index < 0) {
        pinnedBucket = -1;
        hideChartTip();
        return;
      }
      pinnedBucket = pinnedBucket === index ? -1 : index;
      if (pinnedBucket < 0) {
        hideChartTip();
        return;
      }
      showChartTip(pinnedBucket, event.clientX - canvas.getBoundingClientRect().left);
    });
  }
  if (pinnedBucket >= 0) showChartTip(pinnedBucket, chartView.pad.left + pinnedBucket * chartView.slotWidth);
}

// ---- render root + data loading ----
function renderAll() {
  ALL_STATS = buildView(DASH, {hiddenSources, statsPeriod, statsCustom});
  pinnedBucket = -1;
  renderPeriod();
  renderKpis();
  renderChartCard();
  renderBreakdown();
  drawChart();
  const win = statsPeriodWindow(DASH ? DASH.daily || [] : [], statsPeriod, statsCustom);
  document.getElementById('pageDesc').textContent = 'Local token usage across every coding agent.' + (win ? ' · ' + win.from + ' – ' + win.to : ' · all time');
  bindStatsCustomRange();
  document.getElementById('pageMeta').textContent = ALL_STATS.firstDate ? ALL_STATS.firstDate + ' – ' + ALL_STATS.lastDate + ' · ' + ALL_STATS.activeDays + ' active days' : 'No token data';
  document.getElementById('footerMeta').textContent = 'Local data · auto refresh 60s' + (ALL_STATS.firstDate ? ' · ' + ALL_STATS.firstDate + ' – ' + ALL_STATS.lastDate : '');
  renderAvatar();
}

async function loadData() {
  try {
    const response = await fetch('/api/dashboard', {cache:'no-store'});
    if (response.status === 503) throw Error('still building the first snapshot — retrying');
    if (!response.ok) throw Error('API error ' + response.status);
    DASH = await response.json();
    if (!hasLoaded) {
      hiddenModels.clear();
      hiddenSources.clear();
      hasLoaded = true;
    }
    renderAll();
  } catch (error) {
    if (hasLoaded && DASH) {
      console.warn('[dashboard] refresh failed:', error.message);
      return;
    }
    document.getElementById('kpiGrid').innerHTML = '<div class="alert" role="alert"><span>Failed to load token data: ' + escapeHtml(error.message) + '</span><button class="btn btn-outline btn-sm" onclick="location.reload()">Retry</button></div>';
    setTimeout(loadData, 3000);
  }
}

document.getElementById('avatarBtn').onclick = function() { toggleAvatarMenu(); };
document.getElementById('menuEdit').onclick = function() { toggleAvatarMenu(false); showEdit(); };
document.addEventListener('pointerdown', function(event) {
  if (!event.target.closest('.topbar-right')) toggleAvatarMenu(false);
});
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') toggleAvatarMenu(false);
});
loadStatsPeriod();
loadData();
setInterval(loadData, 60000);
window.addEventListener('resize', function() { clearTimeout(window.__chartResize); window.__chartResize = setTimeout(function() { if (ALL_STATS) drawChart(); }, 150); });
</script>
